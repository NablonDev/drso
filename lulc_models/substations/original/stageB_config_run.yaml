# STAGE B -- decoder retrained on the 151 clean hand-drawn polygons.
#
# Stage A gave the encoder features from 10,000 OSM sites. Those labels are
# ~2x oversized, so Stage A's DECODER learned the compound wall. This stage
# replaces that boundary convention using the only trustworthy labels we have,
# while keeping the features.
#
# Encoder runs at 0.1x the decoder LR via EncoderLRScale. Freezing it outright
# was the alternative; 0.1x is preferred because the hand set contains arid and
# small-yard examples the encoder should still be allowed to adapt to, just
# slowly enough not to erase 10,000 sites of features.
#
# Tversky (alpha 0.3 / beta 0.7) appears HERE and only here. beta > alpha
# penalises false negatives, which is the recall dial. Applied in Stage A
# against oversized OSM targets it would push predictions back out toward the
# fence line and undo exactly what this stage exists to fix.
#
# Weights come from Stage A's best checkpoint via LoadPretrainedWeights, never
# --ckpt_path: that would restore Stage A's optimizer state, epoch counter and
# hyperparameters, including its loss and class weights.
seed_everything: 0
custom_modules_path: /home/vivek_jain/seggpt-local/towers_work/custom_modules

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 60
  log_every_n_steps: 10
  enable_checkpointing: true
  default_root_dir: /mnt/cog-data/vivek/stageA/checkpoints/stageB
  callbacks:
    - class_path: stageAB_callbacks.LoadPretrainedWeights
      init_args:
        ckpt_path: /mnt/cog-data/vivek/stageA/checkpoints/stageA/lightning_logs/version_0/checkpoints/epoch15.ckpt
        strict: false
    - class_path: stageAB_callbacks.EncoderLRScale
      init_args:
        scale: 0.1
    - class_path: stageAB_callbacks.SetTverskyLoss
      init_args:
        alpha: 0.3
        beta: 0.7
        gamma: 0.75
        ignore_index: 255
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/IoU_1
        mode: max
        save_top_k: 2
        filename: "epoch{epoch:02d}"
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/IoU_1
        mode: max
        patience: 12
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 16
    num_workers: 4
    train_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/images
    train_label_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/masks
    val_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/images
    val_label_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/masks
    test_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/images
    test_label_data_root: /mnt/drso-data/substation_nat/data/terratorch_data_v3/masks
    train_split: /mnt/drso-data/substation_nat/data/terratorch_data_v3/train_split.txt
    val_split: /mnt/drso-data/substation_nat/data/terratorch_data_v3/val_split.txt
    test_split: /mnt/drso-data/substation_nat/data/terratorch_data_v3/val_split.txt
    img_grep: "*.png"
    label_grep: "*.png"
    means: [123.675, 116.28, 103.53]
    stds: [58.395, 57.12, 58.68]
    num_classes: 2
    train_transform:
      - class_path: albumentations.Affine
        init_args:
          rotate: [-180, 180]
          scale: [0.85, 1.20]
          translate_percent: [-0.08, 0.08]
          border_mode: 0
          fill: 0
          fill_mask: 255
          mask_interpolation: 0
          p: 1.0
      - class_path: albumentations.CenterCrop
        init_args: {height: 512, width: 512}
      - class_path: albumentations.HorizontalFlip
        init_args: {p: 0.5}
      - class_path: albumentations.VerticalFlip
        init_args: {p: 0.5}
      - class_path: albumentations.RandomBrightnessContrast
        init_args: {brightness_limit: 0.15, contrast_limit: 0.15, p: 0.5}
      - class_path: albumentations.RandomGamma
        init_args: {gamma_limit: [85, 115], p: 0.5}
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    val_transform:
      - class_path: albumentations.CenterCrop
        init_args: {height: 512, width: 512}
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    test_transform:
      - class_path: albumentations.CenterCrop
        init_args: {height: 512, width: 512}
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: dinov3_hf_vitl16
      backbone_pretrained: true
      backbone_freeze: false
      necks:
        - name: SelectIndices
          indices: [24]
        - name: ReshapeTokensToImage
      decoder: LinearDecoder
      decoder_upsampling_size: 16
      decoder_num_classes: 2
      num_classes: 2
      peft_config:
        method: LORA
        peft_config_kwargs:
          r: 8
          lora_alpha: 16
          target_modules: [q_proj, v_proj]
    # TerraTorch's init_loss offers no Tversky and takes no kwargs, so `ce`
    # only satisfies construction -- SetTverskyLoss replaces the criterion
    # before the first step. See stageAB_callbacks.SetTverskyLoss.
    loss: ce
    ignore_index: 255
    freeze_backbone: false
    freeze_decoder: false

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 3.e-5
    weight_decay: 0.01
