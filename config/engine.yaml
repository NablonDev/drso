# Internal solver parameters. Not shown to drafters (the Rules screen deliberately has no
# weights). Tuned by the engineering team only.

grid:
  raster_res_m: 20            # rule-compile raster resolution
  site_spacing_m: 50          # candidate tower site spacing (chainage and lateral)
  # targeted finer lattice (Vivek, 14 Oct 2026): the search again at refine_spacing_m, confined to the sites
  # within refine_half_width_m of the 50 m solution (every cap pass too); 0 = off
  refine_spacing_m: 25
  refine_half_width_m: 300
  band_margin_m: 500          # extra length before A and after B in the chainage frame
  raster_margin_m: 0          # padding on raster buffers; spotting repairs grid/exact disagreements
  nudge_radius_m: 30          # how far spotting may move a grid tower to satisfy the exact check
  # a site is usable in the search when a legal cell lies within this distance; the spotting snaps the
  # tower there (10 Oct 2026: a 47 m legal strip between a 66 kV and a 765 kV setback fell between sites)
  site_tolerance_m: 25
  # 11 Oct 2026 speed-ups (exact — same towers either way): the solver keeps the strip-independent edge
  # geometry on the GPU and reuses it across the route variants and the forest-cap passes (GB, 0 = off);
  # spotting skips the vector tower rules in cells two cells clear of every forbidden cell
  edge_cache_gb: 8
  raster_prefilter: true
  # on-disk raster cache (masks, distance and angle fields per layer): 3 GB thrashed once the setback sweep,
  # the rule revisions and the profiling runs shared it (rev 19 compile 127 s with 74 misses vs 45 s warm)
  raster_cache_gb: 12
  # Pricing a bend no larger than the grid's own heading step (7.1° at 400 m spans) as a suspension
  # tower made the search over-optimistic by ₹27-32 Cr on Bhuj–Lakadia (6 Oct 2026): off. The
  # cost-aware string pulling in spotting is what closes the search-vs-final gap.
  heading_slack: false

spans:
  # min span comes from the rule "Span limits at a crossing — Minimum span" (100 m default)
  # max span = the rule "Design span" (plain / hilly), a hard maximum in the search and the spotting
  # (Vivek, 6 Oct 2026; was 1.125 x design span in the search only)
  # Long spans are allowed only where the span crosses a river (best guess, AESL to confirm)
  # TSD span tables (8 Oct 2026): one span ≤ 60 % of the 1,200 m adjacent-span sum → 720 m
  river_crossing_max_span_m: 600          # Vivek, 13 Oct 2026: every crossing span may go to 600 m (was rivers only, 720)
  # Search-grid allowance on crossing-span limits (10 Oct 2026): sites are 50 m apart, so a crossing
  # that fits only with a 292-300 m span (e.g. 101.5 m clear of a 66 kV wire each side) was invisible to
  # the search; it may now exceed the limit by half a site spacing, and the tower spotting slides the two
  # crossing towers along the span until the exact limit holds
  crossing_span_slack_m: 25
  long_heading_limit_deg: 60
  long_heading_step_deg: 5
  long_length_step_m: 50          # 9 Oct 2026: with the 400 m span cap, 100 m steps (500/600/700 m) skipped every crossing length that fits the wind span

crossings:
  single_angle_tolerance_deg: 15   # a rule giving one angle (e.g. river 90°) accepts ±this
  parallel_angle_deg: 30           # span within this angle of a road/canal = running parallel
  # Both towers of a span crossing these features are angle towers, at least B1; the spotting picks
  # the cheapest type that also covers the deflection there, heavier only where a rule asks (railway D,
  # major river D) (Vivek, 6 Oct 2026). Roads: national highways only.
  # River dropped 8 Oct 2026: Rule_Table 38 allows A, B or C at minor river crossings.
  angle_tower_rules: [railway, national_highway]

routes:
  # Each route is the same solver re-run with one extra internal penalty. The reported ₹ cost
  # of every route is always the true cost, never the penalised objective.
  # Route_Rules item 5 (8 Oct 2026): least cost, minimum deviation from the bee-line, relaxed route
  # (the last-resort relaxations of Rule_Table column N), second least cost (least cost kept apart
  # from route 1).
  - {id: 1, key: least_cost,        name: "Least cost"}
  - {id: 2, key: min_deviation,     name: "Minimum deviation from the bee-line", lateral_penalty_rs_per_m_per_km: 40000}
  - {id: 3, key: relaxed,           name: "Relaxed route",                       relaxed: true}
  - {id: 4, key: second_least_cost, name: "Second least cost",                   apart_from: 1}

# Routes searched at once (8 Oct 2026). Routes 1-3 start together; route 2's overlap check waits for
# route 1 and route 4 (apart from route 1) waits for it. Each search runs on its own CUDA stream and
# the CPU work of one route (relaxed compile, tower spotting, events) overlaps another's search.
# Falls back to one at a time when the GPU has less than gpu_gb_per_route free per extra route.
parallel_routes:
  max_workers: 3
  gpu_gb_per_route: 5             # measured 9 Oct: 3 routes peak 10.9 GB on BHU-SHI-0122 (~3.6 GB each)

forest_cap:
  # Vivek, 14 Oct 2026: bisection on the forest price. The search alone (~35 s a pass with the edge cache)
  # finds the lowest multiplier whose search line keeps grid_margin_ha under the cap, then the route is
  # spotted once; if the spotted route is still over the cap the lower bound moves up (at most max_spots
  # spots). The x3/x10/x30/x100 ladder (mode: ladder) spotted every pass, 15 min each, and landed far under
  # the cap at x100 (rev 38: 1.96 ha of a 5 ha cap, back over the km 52-54 hill).
  mode: bisection
  max_mult: 1000
  grid_margin_ha: 1.0
  search_passes: 7
  max_spots: 3
  # ladder mode (kept as a fallback)
  multipliers: [3, 10, 30, 100]
  grid_check_margin: 0

diversity:
  min_distinct_fraction: 0.15     # a route sharing >85 % of its corridor with an earlier one is re-run
  corridor_m: 150
  penalty_rs_per_m: 20000

spotting:
  # Ground-clearance check on the Copernicus GLO-30 DEM (30 m — coarser than the 10 m the
  # research doc asks for; the report says so).
  # TSD Table-4 + note G (150 mm sag error), all voltages (8 Oct 2026)
  ground_clearance_m: {765: 18.15, 400: 8.99, 220: 7.165, 132: 6.25}
  # 765 kV: TSD outline drawings — KNA bottom cross-arm 39.9 m less the 7.635 m suspension string ≈ 32.6 m
  # (EC/ED 32.55 m + 0.3 m ≈ 32.9 m; the lower figure is used for every type). Other voltages unchanged.
  lowest_attachment_m: {765: 32.6, 400: 30.0, 220: 22.0, 132: 18.0}
  # 765 kV: TSD sag-tension sheet, 85 °C nil wind at the 370 m normal span (the design span)
  sag_at_design_span_m: {765: 14.278, 400: 12.0, 220: 9.5, 132: 8.0}
  # the span those sags belong to (TSD normal span at 765 kV); sag scales with (span / this)²,
  # independent of the maximum span (765 kV cap raised to 400 m, 9 Oct 2026)
  sag_reference_span_m: {765: 370, 400: 400, 220: 350, 132: 320}
  simplify_tolerance_m: 30

# AESL Tower Spotting Data, 765 kV D/C Hexa AL59 Zebra WZ-5, R0 24 Jun 2024. Applied to 765 kV
# lines only; other voltages keep the earlier behaviour until their sheets are delivered.
tsd:
  "765":
    # permissible sum of adjacent spans (m) by deviation (°), per tower type; below the first
    # listed deviation the first value applies ("& below"); one span ≤ single_span_fraction × sum
    span_sum:
      A:   [[0, 863], [1, 831], [2, 800]]
      B1:  [[3, 1200], [4, 1183], [5, 1148], [6, 1113], [7, 1078], [8, 1043], [9, 1008], [10, 973], [11, 938], [12, 904], [13, 869], [14, 834], [15, 800]]
      C1:  [[18, 1200], [19, 1175], [20, 1141], [21, 1106], [22, 1072], [23, 1038], [24, 1003], [25, 969], [26, 935], [27, 901], [28, 867], [29, 833], [30, 800]]
      D45: [[32, 1200], [33, 1195], [34, 1161], [35, 1128], [36, 1095], [37, 1061], [38, 1028], [39, 995], [40, 962], [41, 930], [42, 897], [43, 864], [44, 832], [45, 800]]
      D60: [[45, 800], [46, 758], [47, 716], [48, 674], [49, 633], [50, 592], [51, 551], [52, 510], [53, 469], [54, 428], [55, 388], [56, 348], [57, 308], [58, 268], [59, 228], [60, 189]]
    single_span_fraction: 0.6
    # wind span = mean of the two adjacent spans; base towers 400 m; D with body extensions
    wind_span_m: {base: 400, d18: 300, d33: 270, d45: 250}
    # weight span limits (m), both spans [min, max]; H/w of the conductor at 0 °C nil wind
    # (2,013 kg / 1.254 kg/m) for the weight-span arithmetic
    weight_span_m: {A: [200, 600], B1: [0, 600], C1: [0, 600], D45: [-200, 600], D60: [-200, 600]}
    tension_over_weight_m: 1605
    # body extensions available per type (m)
    extensions_m: {A: [3, 4.5, 6], B1: [3, 6], C1: [3, 6], D45: [3, 6, 18, 33, 45], D60: [3, 6, 18, 33, 45]}
    # dead-end towers at the gantries: deviation ≤ 15° line side + 30° slack side (note J)
    dead_end_max_dev_deg: 45

events:
  low_confidence: 0.80
  turn_feature_search_m: 1500
