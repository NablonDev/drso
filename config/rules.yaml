# Default rule set — 29 prototype rules + additions (protected areas, cell towers, wind turbines, village roads, CRZ, bridges, …), five groups (the prototype's Rules screen).
# Retired 6 Oct 2026: "Notified wetland — foundation" (its notified-wetlands layer was dropped; Vivek).
#
# Every value tagged best_guess: true is a placeholder pending AESL confirmation.
# A parameter value is either a scalar or a per-voltage map {765, 400, 220, 132}.
# Per-voltage maps may also be keyed "<kV>_<circuit>" (sc, dc, qc) for circuit-specific values;
# lookup order is "<kV>_<circuit>", then "<kV>", then "default".
#
# mechanism tells the engine how to compile the rule (beeline_engine/rules.py):
#   conductor_clearance  conductor-forbidden buffer around features
#   airport_prohibition  tower + conductor forbidden within a distance of airport features
#   flag_radius          no geometry effect; emits an event for towers inside the radius
#   tower_setback        tower-forbidden buffer around features
#   crossing             crossing checks on spans (angle window, max span, tower type)
#   nogo                 tower and/or conductor forbidden buffers
#   wetland              tower forbidden band; conductor optionally forbidden
#   landclass            LULC/forest class: Allowed (priced) or No-Go; also_layers = extra layers
#                        read whole (e.g. the soil-type layers)
#   geometry             span, deviation, tower-type and section parameters (no layer)

# 8 Oct 2026 (Vivek): rules aligned to the AESL Tower Spotting Data (TSD 765 kV D/C R0 24 Jun 2024 > Route_Rules.xlsx Rule_Table > earlier settings — Vivek, 8 Oct 2026).
# Treatment "Last resort" = No-Go in the normal routes; crossable only in the Relaxed route (route 3),
# which also carries the approval months of Rule_Table column O.
version: "AESL-2026.10-tsd"

groups:
  - key: lock
    title: "Statutory minimums"
    desc: "Legal floors. Editable, but a change is flagged on every export."
    statutory: true
    rules:
      - id: building_clearance
        name: "Clearance from buildings"
        note: "CEA 2023 Reg. 63 — measured at maximum sag and maximum wind deflection"
        layer: buildings
        mechanism: conductor_clearance
        params:
          - {key: vertical_m, label: "Vertical", type: num, unit: m, value: {765: 10.6, 400: 5.6, 220: 4.6, 132: 4.0}, best_guess: true}
          - {key: horizontal_m, label: "Horizontal", type: num, unit: m, value: {765: 8.9, 400: 5.6, 220: 3.8, 132: 2.9}, best_guess: true}
          # distance of the outer phase from the line axis; the clearance is measured from there
          # (765 kV D/C 15 m confirmed by Vivek, 7 Oct 2026; other voltages best guess)
          - {key: outer_phase_m, label: "Outer phase from line axis", type: num, unit: m, value: {765: 15.0, 400: 10.0, 220: 7.0, 132: 5.0}, best_guess: true}
          - {key: min_area_m2, label: "Ignore structures smaller than", type: num, unit: "m²", value: 0}

      - id: airport_prohibition
        name: "Airport — no-go buffer and approach funnel"
        note: "Rule_Table 14-15: No-Go 6 km from the airport boundary, 10 km inside the approach funnel (ICAO Annex 14 approach surface from each runway end: 300 m inner edge 60 m beyond the threshold, 15 % divergence each side). Last resort (Relaxed route): 1.5 km / 6 km, 12 months' approval"
        layer: aviation
        classes: [airport]
        also_layers: [approach]            # runways give the approach funnel direction
        mechanism: airport_prohibition
        params:
          - {key: distance_m, label: "From the airport boundary", type: num, unit: m, value: 6000}
          - {key: funnel_m, label: "Inside the approach funnel", type: num, unit: m, value: 10000}
          - {key: last_resort_distance_m, label: "Last resort: boundary", type: num, unit: m, value: 1500}
          - {key: last_resort_funnel_m, label: "Last resort: funnel", type: num, unit: m, value: 6000}
          - {key: applies_to, label: "Applies to", type: sel, value: "EHT and HT", options: ["EHT and HT", "EHT only", "All lines"]}

      - id: airport_noc
        name: "Airport — NOC radius"
        note: "Rule 4(1) — height governed by the AAI colour-coded zoning map"
        layer: aviation
        classes: [airport]
        mechanism: flag_radius
        params:
          - {key: radius_km, label: "Radius from ARP", type: num, unit: km, value: 20}
          - {key: height_source, label: "Height source", type: sel, value: "CCZM", options: ["CCZM", "Fixed cap", "Obstacle surfaces"]}

      - id: pipeline_footing
        name: "Pipeline — tower footing"
        note: "CEA 2023 Reg. 60(4), measured from the pipeline right-of-way edge"
        layer: pipelines
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Setback", type: num, unit: m, value: 30}
          - {key: mitigation, label: "Mitigation allowed below", type: sel, value: "No", options: ["No", "Yes, with grounding"]}

      - id: pipeline_crossing
        name: "Pipeline — crossing angle"
        note: "CEA 2023 Reg. 60(5) — right angles preferred, never below the minimum"
        layer: pipelines
        mechanism: crossing
        params:
          - {key: min_angle_deg, label: "Minimum angle", type: num, unit: "°", value: 75}
          - {key: preferred_angle_deg, label: "Preferred angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: 30}

  - key: nogo
    title: "No-Go zones"
    desc: "The route may not enter."
    rules:
      - id: buildings
        name: "Buildings / manmade structure"
        note: "Includes any compound wall built around the structure"
        layer: buildings
        mechanism: nogo
        params:
          # 765 kV: the tower height (72.5 m) + 40 % = 101.5 m — a falling tower must not reach the house
          # (Vivek, 10 Oct 2026); other voltages keep 100 m until their tower heights are supplied
          - {key: tower_setback_m, label: "Tower setback (tower height + 40 %)", type: num, unit: m, value: {765: 101.5, 400: 100, 220: 100, 132: 100}}
          - {key: conductor_buffer, label: "Conductor buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: conductor_buffer_m, label: "Fixed conductor buffer", type: num, unit: m, value: 30, best_guess: true}
          - {key: applies_to, label: "Applies to", type: sel, value: "All towers", options: ["Angular towers", "All towers"]}
          - {key: min_area_m2, label: "Ignore structures smaller than", type: num, unit: "m²", value: 0}
          - {key: last_resort_max_area_m2, label: "Last resort: cross structures up to", type: num, unit: "m²", value: 10}

      - id: clusters
        name: "Built-up cluster (village)"
        note: "Cluster detection threshold is an AESL assumption, not a regulation"
        layer: clusters
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 200}
          - {key: max_spacing_m, label: "Max spacing between buildings", type: num, unit: m, value: 50}
          - {key: min_area_m2, label: "Minimum cluster area", type: num, unit: "m²", value: 9000}

      # Rule 37 (Vivek, 6 Oct 2026): plotted land is its own rule with the built-up cluster values
      # for now, so the two can be set independently later.
      - id: plotted_land
        name: "Plotted land"
        note: "Rule_Table 19-20: 100 m tower and conductor buffer, No-Go"
        layer: plotted
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 100}

      - id: substations
        name: "Sub-station"
        note: "The gantry is carved out and carries its own buffers"
        layer: substations
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 100}
          - {key: gantry_buffer_m, label: "Gantry substation buffer", type: num, unit: m, value: 10}
          # a substation this close to the gantry point is the terminal yard the line starts / ends in
          - {key: terminal_yard_radius_m, label: "Terminal yard: substation within", type: num, unit: m, value: 150}

      - id: dams
        name: "Dams"
        note: "Rule_Table 21-22: 500 m tower and conductor buffer, No-Go. Dam axes + register points from the water master (8 Oct 2026)"
        layer: dams
        classes: [dam]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Buffer", type: num, unit: m, value: 500}
          - {key: crossing, label: "Crossing", type: sel, value: "Prohibited", options: ["Prohibited", "Allowed"]}

      - id: solar
        name: "Solar park"
        note: "Reduced from 300 m by the change of 17 May 2024"
        layer: solar
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 150}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 150}

      - id: creek
        name: "Creek area"
        note: "Rule_Table 63-64: 500 m; crossing as last resort on pile foundations (12 months)"
        layer: other_water
        classes: [creek]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Buffer", type: num, unit: m, value: 500}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      # Rules 35-36, added 6 Oct 2026 with the water layers (Vivek): reservoir keeps towers 150 m
      # off the water (spans may cross); every "Other water" body is No-Go (switchable).
      - id: reservoir
        name: "Reservoir"
        note: "Rule_Table 35-36: 200 m tower and conductor buffer; crossing as last resort, towers 200 m from the water (6 months)"
        layer: reservoir
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 200}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: lake
        name: "Lake"
        note: "Rule_Table 39-40: corridor half-width buffer; crossing as last resort (6 months)"
        layer: lake
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: pond
        name: "Pond"
        note: "Rule_Table 41-42: 30 m tower and conductor buffer; crossing as last resort (6 months)"
        layer: pond
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 30}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 30}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: other_water
        name: "Other water bodies"
        note: "Beach, coral reef, lagoons, mud flats, salt marsh, mangroves, detected water, 25 km marine buffer — No-Go. Creeks and salt pans have their own last-resort rules (8 Oct 2026)"
        layer: other_water
        classes: [beach, coral_reef, lagoon, mud_flat, salt_marsh, mangrove, detected_water, marine_buffer]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 0}
          - {key: treatment, label: "Treatment", type: sel, value: "No-Go", options: ["No-Go", "Allowed"]}

      # Not in the prototype's 29; added because Vivek set "avoid entry" for wildlife areas
      # (5 Oct 2026). Counted as rule 30 — switchable like any other.
      - id: protected_areas
        name: "National park and wildlife sanctuary"
        note: "No-Go for every route, the relaxed route included (Vivek, 9 Oct 2026). Only 'Learn from existing lines' may open a sanctuary or park that existing towers already stand in — then with forest diversion approval by area (Rule_Table 69-72: ≤ 5 ha Regional Office 6 months, ≤ 40 ha REC 12, > 40 ha Conservator 18). Eco-sensitive zones and the international border are No-Go but have no data layer yet"
        # forest package: national parks + sanctuaries + reserve forest inside them; no ESZ delivered yet
        layer: national_park
        also_layers: [wildlife_sanctuary, forest_in_pa]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 0}
          - {key: treatment, label: "Treatment", type: sel, value: "No-Go", options: ["No-Go", "Allowed"]}

      # Not in the prototype's 29; added 6 Oct 2026 with the CRZ layer (Vivek: sea + 500 m of land
      # No-Go, no CRZ cost). Counted as rule 34. The 500 m is measured from the edge of the
      # delivered sea polygon, which stands in for the HTL until the HTL line is delivered.
      - id: crz
        name: "Coastal regulation zone"
        note: "Rule_Table 61-62: corridor half-width buffer; crossing as last resort on pile foundations (12 months). Measured from the sea polygon edge until the HTL is delivered"
        layer: crz
        classes: [crz_ia, crz_ia_mangrove_buffer, crz_ib, crz_ii, crz_iii_ndz, crz_iiia, crz_iiib, crz_iva, crz_ivb, crz_water]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer from the sea", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer from the sea", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      # Not in the prototype's 29; added 5 Oct 2026 with the Tarang Sanchar cell tower layer.
      # Counted as rule 31. No regulation found — the setback is a falling-structure placeholder.
      - id: cell_towers
        name: "Cell tower"
        note: "Rule_Table 13: 200 m tower and conductor buffer from a 10 m radial base (210 m from the site point)"
        layer: telecom
        classes: [cell_tower]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 210}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 210}

      # Rules 32-33, added 5 Oct 2026 with the LULC model layers. Values confirmed by Vivek as
      # placeholders (5 Oct 2026) until AESL gives blade-throw / road-clearance distances.
      - id: wind_turbines
        name: "Wind turbine"
        note: "Rule_Table 3-4: 200 m tower and conductor buffer from a 10 m radial base (210 m from the turbine point)"
        layer: wind_turbines
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 210}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 210}

      - id: village_roads
        name: "Village road"
        note: "Rule_Table 31-32 (MDR, village roads, CT): 30 m tower buffer; the conductor may cross at any angle"
        layer: village_roads
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Tower setback", type: num, unit: m, value: 30}

      - id: defence
        name: "Defence land"
        note: "Rule_Table 57-58: corridor half-width buffer; crossing No-Go"
        layer: defence
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}

      - id: monuments
        name: "Monument and fort"
        note: "Rule_Table 93-94: 100 m tower and conductor buffer; crossing No-Go"
        layer: monuments
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 100}

  - key: cross
    title: "Crossings"
    desc: "Crossable, with the angle, span and tower type all set here."
    rules:
      - id: railway
        name: "Railway line"
        note: "TSD A: crossing span ≤ 300 m, right angles, D towers, crossing tower ≥ tower height + 6 m from the track centre (78.5 m at 765 kV); Rule_Table 7-8: 100 m tower buffer from the track edge (7.5 m half-width → 107.5 m from the centreline), conductor parallel buffer CHW, angle 80–100°; angle towers both sides"
        layer: rail
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower setback from the track centreline", type: num, unit: m, value: 107.5}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 41, 400: 30.5, 220: 25, 132: 21}}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [80, 100]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}   # Vivek, 13 Oct 2026: was 300 (80 % of the design span)
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "D", options: ["B", "C", "D", "B/C/D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      - id: national_highway
        name: "National highway"
        note: "TSD H: tension towers, crossing span ≤ 250 m; Rule_Table 23-24: tower at tower height from the road edge (72.5 + 20 m half-carriageway = 92.5 m from the centreline at 765 kV), parallel 300 m + 20 m, angle 80–90°"
        layer: roads
        classes: [nh]
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower setback from the centreline", type: num, unit: m, value: {765: 92.5, 400: 80, 220: 80, 132: 80}}
          - {key: parallel_setback_m, label: "Parallel-run setback", type: num, unit: m, value: 320}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [80, 100]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}   # Vivek, 13 Oct 2026: was 250
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "B/C/D", options: ["B", "C", "D", "B/C/D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      - id: state_highway
        name: "State highway"
        note: "Rule_Table 29-30: 80 m tower buffer from the road edge (7 m half-carriageway → 87 m from the centreline), conductor parallel buffer CHW, angle 70–90°; no crossing tower type set (TSD H 'important road crossings' not defined for SH)"
        layer: roads
        classes: [sh]
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower setback from the centreline", type: num, unit: m, value: 87}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 40.5, 400: 30, 220: 24.5, 132: 20.5}}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [70, 110]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "A/B/C/D", options: ["A/B/C/D", "B/C/D", "D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      - id: bridges
        name: "Bridges and flyovers"
        note: "Rule_Table 25-26: crossable at 80–90°, span ≤ 250 m, D towers; flyover crossings carry a tower extension (7 m needed → the D tower's +18 m step, TSD); no tower on the structure"
        layer: bridges
        classes: [road_bridge, rail_bridge, flyover, underpass]
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [80, 100]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}   # Vivek, 13 Oct 2026: was 250
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "D", options: ["B", "C", "D", "B/C/D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: flyover_extension_m, label: "Flyover: crossing tower extension", type: num, unit: m, value: 18}

      - id: river
        name: "River"
        note: "Rule_Table 37-38: 150 m tower and parallel conductor buffer, 90°, major (≥ 600 m wide) D, minor A, B or C; the longest span follows the TSD span tables"
        layer: river
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Bank buffer, each side", type: num, unit: m, value: 150}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: 150}
          - {key: angle_deg, label: "Allowed crossing angle (±15°)", type: num, unit: "°", value: 90}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}   # Vivek, 13 Oct 2026: was the 720 m long-span ceiling
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: major_threshold_m, label: "Major crossing threshold", type: num, unit: m, value: 600}
          - {key: major_tower_type, label: "Major tower type", type: sel, value: "D", options: ["B", "C", "D", "B/C/D"]}
          - {key: tower_type, label: "Minor tower type", type: sel, value: "A/B/C", options: ["A/B/C", "B", "C", "D", "B/C/D"]}

      - id: canal
        name: "Canal"
        note: "Rule_Table 79-80: 30 m from the canal edge for towers and the parallel conductor; A, B or C. The canal lines are centrelines, so a half-width is added first (Vivek, 10 Oct 2026: 15 m each side → 45 m from the centreline)"
        layer: canal
        mechanism: crossing
        params:
          - {key: half_width_m, label: "Canal half-width (added to the buffers)", type: num, unit: m, value: 15}
          - {key: tower_setback_m, label: "Tower buffer from the canal edge", type: num, unit: m, value: 30}
          - {key: parallel_setback_m, label: "Conductor buffer from the canal edge", type: num, unit: m, value: 30}
          - {key: angle_deg, label: "Allowed crossing angle", type: sel, value: "Any", options: ["Any", "90°", "75–90°", "80–100°"]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          # Vivek, 9 Oct 2026: no angle rule for the canal — the span that crosses it is not a parallel run,
          # so it may cross at any angle; spans running alongside within the buffer stay blocked
          - {key: crossing_exempt_from_parallel, label: "Crossing span exempt from the parallel check", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: tower_type, label: "Tower type", type: sel, value: "A/B/C", options: ["A", "B", "C", "D", "A/B/C"]}

      - id: nalla
        name: "Nalla"
        note: "Rule_Table 81-82: 30 m from the nalla edge, nalla 20 m wide → 40 m from the centreline, tower and parallel conductor; crossed at any angle, A, B or C (Vivek, 8 Oct 2026)"
        layer: nalla
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower buffer from the centreline", type: num, unit: m, value: 40}
          - {key: parallel_setback_m, label: "Conductor buffer from the centreline", type: num, unit: m, value: 40}
          - {key: angle_deg, label: "Allowed crossing angle", type: sel, value: "Any", options: ["Any", "90°", "75–90°", "80–100°"]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: tower_type, label: "Tower type", type: sel, value: "A/B/C", options: ["A", "B", "C", "D", "A/B/C"]}

      - id: power_line
        name: "High tension power line"
        note: "765 / 400 / 220 / 132 kV — the wire may be crossed anywhere except next to an existing tower: 20 % of that span from the tower (80 m of a 400 m span; Vivek, 10 Oct 2026); angle 70–110° and span ≤ 350 m (Rule_Table 9-11 had 300; Vivek, 10 Oct 2026); D towers both sides of lines ≥ 400 kV, B/C/D for 132–220 kV (TSD B.1-2); our towers ≥ 80 m (our tower height, Vivek 11 Oct 2026; was 92.5 / 101.5) from their towers and conductors at 765 kV — a falling tower must not reach another line; our conductor keeps CHW from theirs"
        layer: power
        classes: [power_line, power_tower]
        mechanism: crossing
        params:
          # Vivek, 11 Oct 2026: both distances = our tower height, upper limit of the standard body by line
          # voltage (765: 80, 400: 55, 220: 40, 132: 32, 66: 22 m), no extension and no extra buffer; the
          # falling-tower premise is one-sided — our conductor keeps only CHW from their towers and wires
          # Vivek, 13 Oct 2026: the standard body without extension is 72.5 m at 765 kV; a normal tower keeps that from
          # existing towers and conductors when not crossing. (55 / 40 / 32 m for the other line voltages as supplied.)
          - {key: tower_setback_m, label: "Tower to existing tower (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          - {key: conductor_setback_m, label: "Tower to existing conductor (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          # Crossing preferences (Vivek, 13 Oct 2026): preferred = at the null point and at 90°; allowed = within
          # crossing_point_allowed_pct of their span from the null point and within angle_deg. A crossing outside the
          # preference costs the search relax_penalty_pct of the crossing tower's price, so it is used only where the
          # preferred crossing would cost more (a detour, extra towers, or no route).
          - {key: crossing_point_pref_pct, label: "Preferred: at the null point, ± share of their span", type: num, unit: "%", value: 5}
          - {key: crossing_point_allowed_pct, label: "Allowed: from the null point, ± share of their span", type: num, unit: "%", value: 20}
          - {key: crossing_tower_clear_m, label: "… fallback clear of a tower where its span is not mapped", type: num, unit: m, value: 80}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [70, 110]}
          - {key: angle_min_kv, label: "Crossing angle applies from", type: num, unit: kV, value: 66}
          # the two crossing towers stand 1.2-1.7 × our tower height from the crossed conductor, no more (72.5 m → 87-123 m)
          - {key: crossing_side_m, label: "Crossing tower to the crossed conductor, each side (min-max)", type: rng, unit: m, value: {765: [87, 123], 400: [66, 94], 220: [48, 68], 132: [38, 54]}}
          - {key: relax_penalty_pct, label: "Search allowance for a non-preferred crossing, % of the crossing tower's price", type: num, unit: "%", value: 20}
          - {key: tower_type, label: "Tower type", type: sel, value: "B/C/D", options: ["A/B/C/D", "B", "C", "D", "B/C/D"]}
          - {key: tower_type_400kv, label: "Tower type, lines of 400 kV and above", type: sel, value: "D", options: ["B/C/D", "D"]}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      # Added 6 Oct 2026 with the HT / LT split (Vivek): same values as the high tension rule for
      # now, set independently. Same shutdown crossing cost.
      - id: power_line_lt
        name: "Low tension power line"
        note: "66 / 33 kV — crossed anywhere except next to a pole: 20 % of that span from the pole (20 m of a 100 m pole span; Vivek, 10 Oct 2026); suspension or tension towers either side (TSD B.3); angle 70–110° from 66 kV (Rule_Table 9); our towers ≥ 80 m (our tower height, Vivek 11 Oct 2026; was 92.5 / 101.5) from their poles and conductors at 765 kV"
        layer: power_lt
        classes: [power_line, power_tower]
        mechanism: crossing
        params:
          # Vivek, 11 Oct 2026: both distances = our tower height, upper limit of the standard body by line
          # voltage (765: 80, 400: 55, 220: 40, 132: 32, 66: 22 m), no extension and no extra buffer; the
          # falling-tower premise is one-sided — our conductor keeps only CHW from their towers and wires
          # Vivek, 13 Oct 2026: the standard body without extension is 72.5 m at 765 kV; a normal tower keeps that from
          # existing towers and conductors when not crossing. (55 / 40 / 32 m for the other line voltages as supplied.)
          - {key: tower_setback_m, label: "Tower to existing tower (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          - {key: conductor_setback_m, label: "Tower to existing conductor (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          # Crossing preferences (Vivek, 13 Oct 2026): preferred = at the null point and at 90°; allowed = within
          # crossing_point_allowed_pct of their span from the null point and within angle_deg. A crossing outside the
          # preference costs the search relax_penalty_pct of the crossing tower's price, so it is used only where the
          # preferred crossing would cost more (a detour, extra towers, or no route).
          - {key: crossing_point_pref_pct, label: "Preferred: at the null point, ± share of their span", type: num, unit: "%", value: 5}
          - {key: crossing_point_allowed_pct, label: "Allowed: from the null point, ± share of their span", type: num, unit: "%", value: 20}
          - {key: crossing_tower_clear_m, label: "… fallback clear of a tower where its span is not mapped", type: num, unit: m, value: 80}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [70, 110]}
          - {key: angle_min_kv, label: "Crossing angle applies from", type: num, unit: kV, value: 66}
          # the two crossing towers stand 1.2-1.7 × our tower height from the crossed conductor, no more (72.5 m → 87-123 m)
          - {key: crossing_side_m, label: "Crossing tower to the crossed conductor, each side (min-max)", type: rng, unit: m, value: {765: [87, 123], 400: [66, 94], 220: [48, 68], 132: [38, 54]}}
          - {key: relax_penalty_pct, label: "Search allowance for a non-preferred crossing, % of the crossing tower's price", type: num, unit: "%", value: 20}
          - {key: tower_type, label: "Tower type", type: sel, value: "A/B/C/D", options: ["A/B/C/D", "B", "C", "D", "B/C/D"]}
          - {key: tower_type_400kv, label: "Tower type, lines of 400 kV and above", type: sel, value: "D", options: ["B/C/D", "D"]}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

  - key: gng
    title: "Land classes — go or no-go"
    desc: "Each class is either routable or not. No weights: how strongly the engine prefers one class is internal, not a business input."
    rules:
      - id: forest
        name: "Reserve and protected forest"
        note: "Routable by default — diversion approval is required in every case. Set to No-Go to keep the route out entirely; or cap the hectares a strict route may take (Vivek, 10 Oct 2026: 5 ha), which the search meets by pricing forest up until the route stays under it."
        layer: reserve_forest
        also_layers: [forest_in_pa]
        mechanism: landclass
        cost_class: forest
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}
          - {key: ro_threshold_ha, label: "Regional Office threshold", type: num, unit: ha, value: 5}
          - {key: conservator_threshold_ha, label: "Conservator inspection threshold", type: num, unit: ha, value: 40}
          # Vivek, 10 Oct 2026: cap on the reserve forest a strict route (1, 2, 4) may take. The search prices
          # forest ×3 / ×10 / ×30 until the route is under the cap; the reported cost uses the true prices.
          # 0 = no cap. The relaxed route is exempt.
          - {key: max_area_ha, label: "Max reserve forest per route (strict routes)", type: num, unit: ha, value: 5}

      - id: agriculture
        name: "Agricultural land"
        note: "Compensation cost applies across the corridor and is set on the Costs screen"
        layer: lulc
        classes: [agriculture, agriculture_fallow]
        mechanism: landclass
        cost_class: agriculture
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}

      - id: orchard
        name: "Orchard and plantation"
        note: "Rule_Table 85-86: corridor half-width buffer; crossing as last resort, with the orchard cost"
        layer: lulc
        classes: [orchard]
        mechanism: landclass
        cost_class: orchard
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}

      - id: marsh
        name: "Marshy land"
        note: "Rule_Table 77-78 had 50 m / last resort. Vivek, 10 Oct 2026: towers allowed on marshy land, on pile foundations (soil multiplier 1.85 through the layer's foundation class) — existing lines run through the soil-map marsh"
        layer: lulc
        classes: [marsh]
        also_layers: [marshy_land]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 50}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}

      - id: salt_pans
        name: "Salt pans"
        note: "Rule_Table 59-60: 200 m buffer; crossing as last resort on pile foundations (12 months)"
        layer: lulc
        classes: [salt_pan]
        also_layers: [salt_pans]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 200}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      - id: salt_pan_water
        name: "Salt pans (water bodies)"
        note: "Salt pans mapped in the water layers: Rule_Table 59-60, 200 m buffer, crossing as last resort on piles (12 months)"
        layer: other_water
        classes: [salt_pan]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 200}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      - id: wetland
        name: "Wetland"
        note: "Rule_Table 75-76: routable; towers on pile foundations (no foundation within 50 m of the 10-year mean high-flood level — no HFL data yet)"
        layer: wet_land
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "None", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}

      - id: social_forest
        name: "Social forest"
        note: "Planted strip alongside road, canal or railway"
        layer: social_forest
        mechanism: landclass
        cost_class: social_forest
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}
          - {key: strip_width_m, label: "Strip width from infrastructure", type: num, unit: m, value: 30}

      - id: barren
        name: "Shrubs, barren and hard rock"
        note: "Cheapest ground on any corridor; hard rock is dearer to excavate, which the foundation rate handles"
        layer: lulc
        classes: [shrub, barren, hard_rock, sand_dunes, unclassified]
        also_layers: [hard_rock, sand_dunes]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}

  - key: geo
    title: "Geometry and towers"
    desc: "Span, deviation and tower selection. No layer needed."
    rules:
      - id: max_deviation
        name: "Maximum angular deviation"
        note: "Top of the largest tower class available"
        mechanism: geometry
        params:
          - {key: limit_deg, label: "Limit", type: num, unit: "°", value: 60}

      - id: design_span
        name: "Design span"
        note: "Hard maximum span per voltage. 765 kV: 400 m (Vivek, 9 Oct 2026 — the TSD wind span of the base towers; the TSD normal span of 370 m stays the sag reference). Hilly = the ground rises more than 10 m between adjacent towers (Route_Rules 3); towers on a hilly span are tension towers (B1 at least). The TSD span tables (sum of adjacent spans by deviation, wind span ≤ 400 m) apply on top. River crossings excepted."
        mechanism: geometry
        params:
          - {key: plain_m, label: "Plain terrain", type: num, unit: m, value: {765: 400, 400: 400, 220: 350, 132: 320}}
          - {key: hilly_m, label: "Hilly terrain", type: num, unit: m, value: {765: 400, 400: 400, 220: 350, 132: 320}}
          - {key: hilly_rise_m, label: "Hilly: ground rise between towers over", type: num, unit: m, value: 10}
          - {key: urban_m, label: "Urban / populated", type: num, unit: m, value: {765: 250, 400: 250, 220: 225, 132: 200}, best_guess: true}

      - id: section_interval
        name: "Section point interval"
        note: "Tension point using a B/DB, C/DC or D/DD tower"
        mechanism: geometry
        params:
          - {key: plain_km, label: "Plain terrain", type: num, unit: km, value: 5}
          - {key: hilly_km, label: "Hilly terrain", type: num, unit: km, value: 3}
          - {key: plain_spans, label: "Plain terrain, spans", type: num, unit: spans, value: 15}
          - {key: hilly_spans, label: "Hilly terrain, spans", type: num, unit: spans, value: 10}

      - id: corridor_half_width
        name: "Corridor half-width"
        note: "Half the notified right of way for the line voltage (MoP RoW guidelines 2015)"
        mechanism: geometry
        params:
          - {key: half_width_m, label: "Half-width for this line", type: num, unit: m,
             value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5},
             best_guess: true}
          - {key: urban_half_width_m, label: "Urban half-width", type: num, unit: m, value: {765: 27, 400: 20, 220: 15, 132: 12}, best_guess: true}

      - id: approach_section
        name: "Approach section near substation"
        note: "CEA Technical Standards (1st Amendment) 2025, Schedule VII: near the substation the RoW narrows (765 kV D/C 54 m) and the span is at most 250 m. Applied within the set distance of each gantry, start and end (Vivek, 8 Oct 2026: 2 km); buffers tied to the corridor half-width shrink with it. Go zone (Vivek, 9 Oct 2026: 500 m round each gantry): no setback, crossing or water rule applies — a tower may stand in a pond or wetland — only a tower base may not overlap a substation or an existing tower (power, telecom, wind turbine). Base = the largest tower type's base square; an existing tower is taken as the same size."
        mechanism: geometry
        params:
          - {key: length_m, label: "Distance from the gantry", type: num, unit: m, value: 2000}
          - {key: half_width_m, label: "Approach half-width (RoW / 2)", type: num, unit: m, value: {765: 27, 400: 19, 220: 12, 132: 9.5}}
          - {key: span_m, label: "Approach maximum span", type: num, unit: m, value: {765: 250, 400: 250, 220: 200, 132: 150}}
          - {key: go_zone_m, label: "Go zone round each gantry", type: num, unit: m, value: 500}

      # Soft rules (Vivek, 9 Oct 2026): they steer the search, never the reported cost.
      - id: existing_line_proximity
        name: "Stay close to existing lines (search only)"
        note: "Spans within the set distance of an existing line or tower of at least the set voltage get a discount on their line and RoW cost in the search and the tower spotting — the route is pulled towards existing corridors. The reported cost of every route is the true cost, without the discount. Parallel-spacing and crossing rules still apply."
        layer: power
        mechanism: soft
        params:
          - {key: distance_m, label: "Within", type: num, unit: m, value: 1000}
          - {key: discount_pct, label: "Search discount", type: num, unit: "%", value: 20}
          - {key: min_kv, label: "Existing lines from", type: num, unit: kV, value: 220}

      - id: precedent_easing
        name: "Learn from existing lines"
        note: "Used only when a route finds no feasible path under its rules: a restricted polygon that existing power towers already stand in (a wetland, pond, lake, reservoir, coastal water, CRZ zone, salt pan, forest, wildlife sanctuary or national park) is opened for that route, that polygon only. Crossing rules (rivers, roads, lines) and built-up, substation, airport, defence, monument and dam rules are never eased. Each eased polygon is listed with the route; a sanctuary, park or forest needs forest diversion approval by area."
        layer: power
        mechanism: soft
        params:
          - {key: treatment, label: "When no route is found", type: sel, value: "Ease", options: ["Ease", "Off"]}

      - id: tower_type_bands
        name: "Tower type by deviation"
        note: "Band boundaries in degrees — the band a deviation falls in picks the tower"
        mechanism: geometry
        params:
          # five types of Route Cost Parameters 3 (B2, C2 dropped — Vivek, 7 Oct 2026)
          - {key: A, label: "A up to", type: num, unit: "°", value: 2}
          - {key: B1, label: "B1 up to", type: num, unit: "°", value: 15}
          - {key: C1, label: "C1 up to", type: num, unit: "°", value: 30}
          - {key: D45, label: "D45 up to", type: num, unit: "°", value: 45}
          - {key: D60, label: "D60 up to", type: num, unit: "°", value: 60}

      - id: crossing_span_limits
        name: "Span limits at a crossing"
        note: "Minimum stands in for the falling-tower distance"
        mechanism: geometry
        params:
          - {key: min_span_m, label: "Minimum span", type: num, unit: m, value: 100}
          - {key: angle_point_shift_m, label: "Angle point shift allowance", type: num, unit: m, value: 100}
