# Default rule set — 29 prototype rules + additions (protected areas, cell towers, wind turbines, village roads, CRZ, bridges, …), five groups (the prototype's Rules screen).
# Retired 6 Oct 2026: "Notified wetland — foundation" (its notified-wetlands layer was dropped; Vivek).
#
# Every value tagged best_guess: true is a placeholder pending AESL confirmation.
# A parameter value is either a scalar or a per-voltage map {765, 400, 220, 132}.
# Per-voltage maps may also be keyed "<kV>_<circuit>" (sc, dc, qc) for circuit-specific values;
# lookup order is "<kV>_<circuit>", then "<kV>", then "default".
#
# mechanism tells the engine how to compile the rule (beeline_engine/rules.py):
#   conductor_clearance  conductor-forbidden buffer around features
#   airport_prohibition  tower + conductor forbidden within a distance of airport features
#   flag_radius          no geometry effect; emits an event for towers inside the radius
#   tower_setback        tower-forbidden buffer around features
#   crossing             crossing checks on spans (angle window, max span, tower type)
#   nogo                 tower and/or conductor forbidden buffers
#   wetland              tower forbidden band; conductor optionally forbidden
#   landclass            LULC/forest class: Allowed (priced) or No-Go; also_layers = extra layers
#                        read whole (e.g. the soil-type layers)
#   geometry             span, deviation, tower-type and section parameters (no layer)

# 8 Oct 2026 (Vivek): rules aligned to the AESL Tower Spotting Data (TSD 765 kV D/C R0 24 Jun 2024 > Route_Rules.xlsx Rule_Table > earlier settings — Vivek, 8 Oct 2026).
# Treatment "Last resort" = No-Go in the normal routes; crossable only in the Relaxed route (route 3),
# which also carries the approval months of Rule_Table column O.
version: "AESL-2026.10-tsd"

groups:
  - key: lock
    title: "Statutory minimums"
    desc: "Legal floors. Editable, but a change is flagged on every export."
    statutory: true
    rules:
      - id: building_clearance
        name: "Clearance from buildings"
        note: "CEA 2023 Reg. 63 — measured at maximum sag and maximum wind deflection"
        layer: buildings
        mechanism: conductor_clearance
        params:
          - {key: vertical_m, label: "Vertical", type: num, unit: m, value: {765: 10.6, 400: 5.6, 220: 4.6, 132: 4.0}, best_guess: true}
          - {key: horizontal_m, label: "Horizontal", type: num, unit: m, value: {765: 8.9, 400: 5.6, 220: 3.8, 132: 2.9}, best_guess: true}
          # distance of the outer phase from the line axis; the clearance is measured from there
          # (765 kV D/C 15 m confirmed by Vivek, 7 Oct 2026; other voltages best guess)
          - {key: outer_phase_m, label: "Outer phase from line axis", type: num, unit: m, value: {765: 15.0, 400: 10.0, 220: 7.0, 132: 5.0}, best_guess: true}
          - {key: min_area_m2, label: "Ignore structures smaller than", type: num, unit: "m²", value: 5}   # final rules 19 Oct 2026 (run BHU-LAK-0250)

      - id: airport_prohibition
        name: "Airport — no-go buffer and approach funnel"
        note: "Rule_Table 14-15: No-Go 6 km from the airport boundary, 10 km inside the approach funnel (ICAO Annex 14 approach surface from each runway end: 300 m inner edge 60 m beyond the threshold, 15 % divergence each side). Last resort (Relaxed route): 1.5 km / 6 km, 12 months' approval"
        layer: aviation
        classes: [airport]
        also_layers: [approach]            # runways give the approach funnel direction
        mechanism: airport_prohibition
        params:
          - {key: distance_m, label: "From the airport boundary", type: num, unit: m, value: 6000}
          - {key: funnel_m, label: "Inside the approach funnel", type: num, unit: m, value: 10000}
          - {key: last_resort_distance_m, label: "Last resort: boundary", type: num, unit: m, value: 1500}
          - {key: last_resort_funnel_m, label: "Last resort: funnel", type: num, unit: m, value: 6000}
          - {key: applies_to, label: "Applies to", type: sel, value: "EHT and HT", options: ["EHT and HT", "EHT only", "All lines"]}

      - id: airport_noc
        name: "Airport — NOC radius"
        note: "Rule 4(1) — height governed by the AAI colour-coded zoning map"
        layer: aviation
        classes: [airport]
        mechanism: flag_radius
        params:
          - {key: radius_km, label: "Radius from ARP", type: num, unit: km, value: 20}
          - {key: height_source, label: "Height source", type: sel, value: "CCZM", options: ["CCZM", "Fixed cap", "Obstacle surfaces"]}

      - id: pipeline_footing
        name: "Pipeline — tower footing"
        note: "CEA 2023 Reg. 60(4), measured from the pipeline right-of-way edge"
        layer: pipelines
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Setback", type: num, unit: m, value: 30}
          - {key: mitigation, label: "Mitigation allowed below", type: sel, value: "No", options: ["No", "Yes, with grounding"]}

      - id: pipeline_crossing
        name: "Pipeline — crossing angle"
        note: "CEA 2023 Reg. 60(5) — right angles preferred, never below the minimum"
        layer: pipelines
        mechanism: crossing
        params:
          - {key: min_angle_deg, label: "Minimum angle", type: num, unit: "°", value: 75}
          - {key: preferred_angle_deg, label: "Preferred angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 600}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: 30}

  - key: nogo
    title: "No-Go zones"
    desc: "The route may not enter."
    rules:
      - id: buildings
        name: "Buildings / manmade structure"
        note: "Includes any compound wall built around the structure"
        layer: buildings
        mechanism: nogo
        params:
          # 765 kV: the tower height (72.5 m) + 40 % = 101.5 m — a falling tower must not reach the house
          # (Vivek, 10 Oct 2026); other voltages keep 100 m until their tower heights are supplied
          # Vivek, 13 Oct 2026 (2nd): tower and conductor both keep the corridor half-width from a single
          # building (was the tower height), measured from the raw footprint; clusters keep 200 m / 200 m
          - {key: tower_setback_m, label: "Tower setback (corridor half-width)", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer, label: "Conductor buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: conductor_buffer_m, label: "Fixed conductor buffer", type: num, unit: m, value: 30, best_guess: true}
          - {key: applies_to, label: "Applies to", type: sel, value: "All towers", options: ["Angular towers", "All towers"]}
          - {key: min_area_m2, label: "Ignore structures smaller than", type: num, unit: "m²", value: 5}   # final rules 19 Oct 2026 (run BHU-LAK-0250)
          - {key: last_resort_max_area_m2, label: "Last resort: cross structures up to", type: num, unit: "m²", value: 10}
          # soft zone (Vivek, 19 Oct 2026; off while equal to the tower setback): towers and conductor may come down to
          # soft_min_m at a SEARCH cost per building of A + rate x (setback - distance), each building once, flagged with
          # its distance; the CEA clearance rule (building_clearance, 23.9 m at 765 kV) still holds for the conductor.
          # A = ₹2.2 lakh, the lenient relocation figure: RFCTLARR 2nd Schedule transport ₹50,000 + one-time
          # resettlement ₹50,000 + a PMAY-G rural house ₹1.20 lakh; rate ₹1 lakh per metre
          - {key: soft_min_m, label: "Soft zone: towers and conductor down to", type: num, unit: m, value: {765: 20, 400: 23, 220: 17.5, 132: 13.5}}   # final rules 19 Oct 2026 (run BHU-LAK-0250): 765 kV down to 20 m at the search cost; other voltages unchanged (zone off)
          - {key: soft_cost_per_building_cr, label: "Soft zone: search cost per building", type: num, unit: "₹ Cr", value: 0.022}
          - {key: soft_cost_per_m_cr, label: "… plus per metre inside the setback", type: num, unit: "₹ Cr", value: 0.01}

      - id: clusters
        name: "Built-up cluster (village)"
        note: "Cluster detection threshold is an AESL assumption, not a regulation. Vivek, 18 Oct 2026: 200 m is the normal distance for towers and conductor; the route may come as close as the breach distance (100 m) where it pays: every span whose conductor or end tower comes inside the normal distance costs the search the breach charge (₹0.5 Cr per span, search only — not in the reported cost) and is shown as a warning"
        layer: clusters
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer (normal)", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer (normal)", type: num, unit: m, value: 200}
          - {key: breach_min_m, label: "Breach: closest allowed, tower and conductor (= the normal value: no breach)", type: num, unit: m, value: 100}
          - {key: breach_cost_cr_per_span, label: "Breach: search cost per span inside the normal distance", type: num, unit: "₹ Cr", value: 0.5}
          - {key: max_spacing_m, label: "Max spacing between buildings", type: num, unit: m, value: 50}
          - {key: min_area_m2, label: "Minimum cluster area", type: num, unit: "m²", value: 9000}

      # Rule 37 (Vivek, 6 Oct 2026): plotted land is its own rule with the built-up cluster values
      # for now, so the two can be set independently later.
      - id: plotted_land
        name: "Plotted land"
        note: "Rule_Table 19-20: 100 m tower and conductor buffer, No-Go"
        layer: plotted
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 100}

      - id: substations
        name: "Sub-station"
        note: "The gantry is carved out and carries its own buffers"
        layer: substations
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          # Vivek, 13 Oct 2026: the conductor keeps the corridor half-width from every substation boundary,
          # the terminal ones included (all but the gantry span itself)
          - {key: conductor_buffer_m, label: "Conductor buffer (corridor half-width)", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: gantry_buffer_m, label: "Gantry substation buffer", type: num, unit: m, value: 10}
          # a substation this close to the gantry point is the terminal yard the line starts / ends in
          - {key: terminal_yard_radius_m, label: "Terminal yard: substation within", type: num, unit: m, value: 150}
          - {key: gantry_min_span_m, label: "Gantry to first / last tower, at least", type: num, unit: m, value: 100}
          # Vivek, 19 Oct 2026 (gantry review): the AESL design's gantry spans are 206-217 m
          - {key: gantry_max_span_m, label: "Gantry to first / last tower, at most (0 = no limit)", type: num, unit: m, value: 250}
          # Vivek, 19 Oct 2026: 45° — TSD note J (15° line side + 30° slack side); the AESL design turns 42-56° at its first tower
          - {key: dead_end_max_dev_deg, label: "Max deviation at the dead-end tower", type: num, unit: "°", value: 45}
          # Vivek, 19 Oct 2026: the dead-end tower stands exactly this far from the gantry point, on the line square to the
          # terminal substation's face (the substation polygon edge nearest the gantry); 0 = anywhere at least the gantry span
          # final rules 19 Oct 2026 (run BHU-LAK-0250): the fixed dead end is available but off (set 100 m + Yes to apply it)
          - {key: dead_end_distance_m, label: "Dead-end tower: exactly this far from the gantry (0 = free)", type: num, unit: m, value: 0}
          - {key: dead_end_square, label: "Gantry span square (90°) to the substation face", type: sel, value: "No", options: ["Yes", "No"]}
          # Vivek, 19 Oct 2026 (gantry review): the gantry span leaves within this of square to the terminal substation's face
          # (straightened outline, the face the gantry stands in front of, never one turned away from the route); the AESL design
          # is 8° off at Shivlaka, 37° at Bhujpool
          # Vivek, 21 Oct 2026 (gantry sweep, 84 section solves): ±60° — at ±40° the dead-end tower at Bhujpool, beside the
          # existing line's own exit, cannot keep its 45° turn; 100-250 m / ±60° / 45° held at both ends, line kept or removed
          - {key: gantry_square_tol_deg, label: "Gantry span within this of square to the substation face (0 = off)", type: num, unit: "°", value: 60}
          # Vivek, 20 Oct 2026: the gantry rules at both ends, or at one end only — where the other end is an existing tower
          # the route joins (e.g. AESL AP-56 / AP-57 at Shivlaka). 21 Oct 2026 (Vivek): all four gantry rules — gantry span
          # at least / at most, square to the face, dead-end turn (was the span maximum and the square rule only); at an end
          # where they are off its last span and tower keep the ordinary span and turn limits
          - {key: gantry_rules_at, label: "Gantry rules (gantry span min / max, square to the face, dead-end turn) apply at", type: sel, value: "Both ends", options: ["Both ends", "Start (A) only", "End (B) only"]}
          # Vivek, 21 Oct 2026: end B is an existing tower the route connects to (AESL AP-56 on the Bhuj-Lakadia line). The
          # existing tower nearest B (within join_snap_m) is joined, not avoided; the existing line through it is lifted within
          # join_radius_m of B (its towers there and its wire inside that circle: no tower / wire clearances, no crossing rule),
          # so the new line may run alongside it into the joined tower. Every other existing line and the rest of this one keep
          # all their rules. Off by default.
          - {key: b_joins_existing_tower, label: "End B joins an existing tower (its line's clearances lifted near B)", type: sel, value: "No", options: ["No", "Yes"]}
          - {key: join_snap_m, label: "… the joined tower: the existing tower within this of B", type: num, unit: m, value: 30}
          - {key: join_radius_m, label: "… that line's towers and wire lifted within this of B", type: num, unit: m, value: 400}
          # 23 Oct 2026: the existing line terminating in the start substation is lifted the same way at A (its last tower
          # within join_snap_m of A, its wire within join_radius_m), so the gantry span can leave the yard
          - {key: a_lifts_existing_line, label: "At A: lift the existing line ending in the substation", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: a_lift_near_m, label: "… a wire within this of A counts as ending there", type: num, unit: m, value: 100}

      - id: dams
        name: "Dams"
        note: "Rule_Table 21-22: 500 m tower and conductor buffer, No-Go. Dam axes + register points from the water master (8 Oct 2026)"
        layer: dams
        classes: [dam]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Buffer", type: num, unit: m, value: 500}
          - {key: crossing, label: "Crossing", type: sel, value: "Prohibited", options: ["Prohibited", "Allowed"]}

      - id: solar
        name: "Solar park"
        note: "Reduced from 300 m by the change of 17 May 2024"
        layer: solar
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 150}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 150}

      - id: creek
        name: "Creek area"
        note: "Rule_Table 63-64: 500 m; crossing as last resort on pile foundations (12 months)"
        layer: other_water
        classes: [creek]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Buffer", type: num, unit: m, value: 500}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      # Rules 35-36, added 6 Oct 2026 with the water layers (Vivek): reservoir keeps towers 150 m
      # off the water (spans may cross); every "Other water" body is No-Go (switchable).
      - id: reservoir
        name: "Reservoir"
        note: "Rule_Table 35-36: 200 m tower and conductor buffer; crossing as last resort, towers 200 m from the water (6 months)"
        layer: reservoir
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer (normal)", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer (normal)", type: num, unit: m, value: 200}
          # priced breach (Vivek, 22 Oct 2026, as the village cluster): towers and conductor may come down to the
          # breach distance; every span inside the normal distance costs the search the charge and is warned
          - {key: breach_min_m, label: "Breach: closest allowed, tower and conductor (= the normal value: no breach)", type: num, unit: m, value: 100}
          - {key: breach_cost_cr_per_span, label: "Breach: search cost per span inside the normal distance", type: num, unit: "₹ Cr", value: 0.5}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: lake
        name: "Lake"
        note: "Rule_Table 39-40: corridor half-width buffer; crossing as last resort (6 months)"
        layer: lake
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: pond
        name: "Pond"
        note: "Rule_Table 41-42: 30 m tower and conductor buffer; crossing as last resort (6 months). Vivek, 18 Oct 2026: a pond of at most 1 ha may be spanned in one span — towers keep the 30 m buffer from its edge, the conductor may pass over it — and the span is flagged as a warning; larger ponds and ponds without an outline (points / lines, no area) keep the full rule"
        layer: pond
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 30}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 30}
          # Vivek, 19 Oct 2026: no size limit — any pond outline may be spanned where one span clears it (towers keep the
          # buffer, none can stand in the water); 0 = no limit
          - {key: small_max_area_ha, label: "Spannable pond: area up to (0 = any size)", type: num, unit: ha, value: 0}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "No", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 6}

      - id: other_water
        name: "Other water bodies"
        note: "Beach, coral reef, lagoons, mud flats, salt marsh, mangroves, detected water, 25 km marine buffer — No-Go. Creeks and salt pans have their own last-resort rules (8 Oct 2026)"
        layer: other_water
        classes: [beach, coral_reef, lagoon, mud_flat, salt_marsh, mangrove, detected_water, marine_buffer]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 0}
          - {key: treatment, label: "Treatment", type: sel, value: "No-Go", options: ["No-Go", "Allowed"]}

      # Not in the prototype's 29; added because Vivek set "avoid entry" for wildlife areas
      # (5 Oct 2026). Counted as rule 30 — switchable like any other.
      - id: protected_areas
        name: "National park, wildlife sanctuary and eco-sensitive zone"
        note: "No-Go for every route, the relaxed route included (Vivek, 9 Oct 2026). Only 'Learn from existing lines' may open a sanctuary or park that existing towers already stand in — then with forest diversion approval by area (Rule_Table 69-72: ≤ 5 ha Regional Office 6 months, ≤ 40 ha REC 12, > 40 ha Conservator 18). Eco-sensitive zones joined as No-Go with forest package 2 (Vivek, 13 Oct 2026); the international border is No-Go but has no data layer yet"
        # forest package 2 (13 Oct 2026): national parks + sanctuaries + reserve forest inside them + ESZ
        layer: national_park
        also_layers: [wildlife_sanctuary, forest_in_pa, eco_sensitive_zone]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 0}
          - {key: treatment, label: "Treatment", type: sel, value: "No-Go", options: ["No-Go", "Allowed"]}

      # Not in the prototype's 29; added 6 Oct 2026 with the CRZ layer (Vivek: sea + 500 m of land
      # No-Go, no CRZ cost). Counted as rule 34. The 500 m is measured from the edge of the
      # delivered sea polygon, which stands in for the HTL until the HTL line is delivered.
      - id: crz
        name: "Coastal regulation zone"
        note: "Rule_Table 61-62: corridor half-width buffer; crossing as last resort on pile foundations (12 months). Measured from the sea polygon edge until the HTL is delivered"
        layer: crz
        classes: [crz_ia, crz_ia_mangrove_buffer, crz_ib, crz_ii, crz_iii_ndz, crz_iiia, crz_iiib, crz_iva, crz_ivb, crz_water]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer from the sea", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer from the sea", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      # Not in the prototype's 29; added 5 Oct 2026 with the Tarang Sanchar cell tower layer.
      # Counted as rule 31. No regulation found — the setback is a falling-structure placeholder.
      - id: cell_towers
        name: "Cell tower"
        note: "Rule_Table 13: 200 m tower and conductor buffer from a 10 m radial base (210 m from the site point)"
        layer: telecom
        classes: [cell_tower]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 210}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 210}

      # Rules 32-33, added 5 Oct 2026 with the LULC model layers. Values confirmed by Vivek as
      # placeholders (5 Oct 2026) until AESL gives blade-throw / road-clearance distances.
      - id: wind_turbines
        name: "Wind turbine"
        note: "Rule_Table 3-4: 200 m tower and conductor buffer from a 10 m radial base (210 m from the turbine point)"
        layer: wind_turbines
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 210}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 210}

      - id: village_roads
        name: "Village road"
        note: "Rule_Table 31-32 (MDR, village roads, CT): 30 m tower buffer; the conductor may cross at any angle"
        layer: village_roads
        mechanism: tower_setback
        params:
          # final rules 19 Oct 2026 (run BHU-LAK-0250): the 30 m buffer removed — the tower is only kept off the road itself:
          # half the 28 m 765 kV tower base (14 m) + half a single-lane road (~2.5 m) from the mapped centreline
          - {key: setback_m, label: "Tower setback from the centreline (tower kept off the road)", type: num, unit: m, value: 16.5}

      - id: defence
        name: "Defence land"
        note: "Rule_Table 57-58: corridor half-width buffer; crossing No-Go"
        layer: defence
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}

      - id: monuments
        name: "Monument and fort"
        note: "Rule_Table 93-94: 100 m tower and conductor buffer; crossing No-Go"
        layer: monuments
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 100}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 100}

  - key: cross
    title: "Crossings"
    desc: "Crossable, with the angle, span and tower type all set here."
    rules:
      - id: railway_platforms
        name: "Railway platform"
        note: "Indian Railways platform polygons (Vivek, 14 Oct 2026): towers 200 m from a platform, the conductor the corridor half-width when not crossing"
        layer: rail_platforms
        classes: [platform]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower setback from the platform", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer (corridor half-width)", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}

      - id: platform_crossing_zone
        name: "No crossing near a station"
        note: "The line may not cross the railway over a platform or within 1,500 m beyond either end of it, along its long side (Vivek, 14 Oct 2026); the zone is drawn from each platform's rectangle"
        layer: rail_platforms
        classes: [platform_crossing_zone]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 0}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 0}

      - id: railway
        name: "Railway line"
        note: "TSD A: crossing span ≤ 300 m, right angles, D towers, crossing tower ≥ tower height + 6 m from the track centre (78.5 m at 765 kV); Rule_Table 7-8: 100 m tower buffer from the track edge (7.5 m half-width → 107.5 m from the centreline), conductor parallel buffer CHW, angle 80–100°; angle towers both sides"
        layer: rail
        mechanism: crossing
        params:
          # Vivek, 14 Oct 2026 (Indian Railways track layer): towers 86 m from the line, conductor CHW when not
          # crossing, crossing at 90 ± 10° on a span of at most 300 m
          - {key: tower_setback_m, label: "Tower setback from the track centreline", type: num, unit: m, value: 86}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run (corridor half-width)", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          # Vivek, 23 Oct 2026: crossed at 85-90° only, on D60 towers, with a span of 250-265 m; no relaxation
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [85, 95]}
          - {key: min_span_m, label: "Min crossing span", type: num, unit: m, value: 250}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 265}
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "D60", options: ["B", "C", "D", "D60", "B/C/D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      - id: national_highway
        name: "National highway"
        note: "TSD H: tension towers, crossing span ≤ 250 m; Rule_Table 23-24: tower at tower height from the road edge (72.5 + 20 m half-carriageway = 92.5 m from the centreline at 765 kV), parallel 300 m + 20 m, angle 80–90°. Vivek, 17 Oct 2026: no parallel-run buffer; tower setback stays measured from the centreline"
        layer: roads
        classes: [nh]
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower setback from the centreline", type: num, unit: m, value: {765: 92.5, 400: 80, 220: 80, 132: 80}}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [80, 100]}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 250}   # TSD H (audit H2, 17 Oct 2026; 13 Oct value 600)
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "B/C/D", options: ["B", "C", "D", "B/C/D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 60}   # Vivek, 23 Oct 2026: 60 (was 45); span ≤ 250 m, no relaxation

      - id: state_highway
        name: "State highway"
        note: "Rule_Table 29-30: 80 m tower buffer from the road edge (7 m half-carriageway → 87 m from the centreline), conductor parallel buffer CHW; no crossing tower type set (TSD H 'important road crossings' not defined for SH). Vivek, 16 Oct 2026: crossing angle 60–90° (the smaller angle between line and road); crossing span 240–260 m normally — outside that band it needs an approval record (the search keeps to the band at a penalty) — and never over 400 m. 17 Oct 2026: no parallel-run buffer; tower setback stays 87 m from the centreline"
        layer: roads
        classes: [sh]
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Tower setback from the centreline", type: num, unit: m, value: 87}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [60, 120]}
          # Vivek, 23 Oct 2026: crossing span ≤ 250 m, no relaxation (the 240-260 m approval band is gone); crossing
          # towers at least B; deviation at them up to 60°
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 250}
          - {key: tower_type, label: "Crossing tower type", type: sel, value: "B/C/D", options: ["A/B/C/D", "B/C/D", "D"]}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 60}

      - id: bridges
        name: "Bridges and flyovers"
        note: "Vivek, 17 Oct 2026: a bridge or flyover inherits the rules of the road it carries — the NH / SH crossing rules come from that road's line in the roads layer, which runs over the structure; rail bridges stay under the railway rule. The bridge rule itself keeps only: no tower on the structure. A road bridge, flyover or underpass the route crosses with no NH / SH line on it is flagged 'classify this structure' (a warning). Was Rule_Table 25-26: 80–90°, span ≤ 250 m, D towers, 18 m flyover extension"
        layer: bridges
        classes: [road_bridge, rail_bridge, flyover, underpass]
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Tower buffer from the structure", type: num, unit: m, value: 0}
          - {key: flag_unclassified, label: "Flag a crossed road structure with no NH / SH on it", type: sel, value: "Yes", options: ["Yes", "No"]}

      - id: river
        name: "River"
        note: "Rule_Table 37-38: 150 m tower buffer from the banks, 90°, major (≥ 600 m wide) D, minor A, B or C; the longest span follows the TSD span tables. Vivek, 16 Oct 2026: no parallel conductor buffer; a reach narrower than 50 m (measured across the channel, from the river polygon) is a small river: towers 30 m from its banks, any crossing angle, ordinary tower types, no crossing-tower turn limit, the ordinary span maximum (400 m); exactly 50 m stays a river. Vivek, 18 Oct 2026: replaced by the narrow river — a reach narrower than 150 m keeps the 150 m bank buffer and is crossed like a canal (any angle, ordinary types, no turn limit, no long span: the ordinary maximum); exactly 150 m stays a river"
        layer: river
        mechanism: crossing
        params:
          - {key: tower_setback_m, label: "Bank buffer, each side", type: num, unit: m, value: 150}
          - {key: angle_deg, label: "Allowed crossing angle (±15°)", type: num, unit: "°", value: 90}
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 720}   # TSD single-span ceiling, 60 % of the 1,200 m adjacent-span sum (audit H1, 17 Oct 2026): with the 150 m bank buffers a river up to 420 m wide can be crossed; wider needs a special crossing design the TSD does not carry
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}
          - {key: major_threshold_m, label: "Major crossing threshold", type: num, unit: m, value: 600}
          - {key: major_tower_type, label: "Major tower type", type: sel, value: "D", options: ["B", "C", "D", "B/C/D"]}
          - {key: tower_type, label: "Minor tower type", type: sel, value: "A/B/C", options: ["A/B/C", "B", "C", "D", "B/C/D"]}
          # narrow rivers (Vivek, 18 Oct 2026; replaces the < 50 m small-river rule of 16 Oct): a reach narrower than
          # this keeps the bank buffer and is crossed like a canal — any angle, ordinary tower types, no turn limit at
          # the crossing towers, no long span (the ordinary span maximum)
          - {key: small_width_m, label: "Narrow river: narrower than", type: num, unit: m, value: 150}
          - {key: small_tower_setback_m, label: "Narrow river: tower buffer from the banks", type: num, unit: m, value: 100}   # Vivek, 19 Oct 2026: was 150

      - id: canal
        name: "Canal"
        note: "Vivek, 17 Oct 2026: one canal rule — tower centre at least 45 m from the mapped canal centreline (the existing effective distance: Rule_Table 79-80's 30 m from the edge + the 15 m half-width assumed on 10 Oct; not added again). No canal-specific wire buffer, crossing angle, crossing span, crossing tower type or crossing-tower turn limit; the canal grants no long span"
        layer: canal
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Tower centre from the canal centreline", type: num, unit: m, value: 45}

      - id: nalla
        name: "Nalla"
        note: "Vivek, 16 Oct 2026: tower centre at least 40 m from the mapped nalla centreline, nothing else — no wire buffer, crossing angle, crossing tower type, crossing span or crossing-tower turn limit for the nalla; the general line limits still apply (was Rule_Table 81-82 as a crossing rule, 8 Oct 2026)"
        layer: nalla
        mechanism: tower_setback
        params:
          - {key: setback_m, label: "Tower centre from the nalla centreline", type: num, unit: m, value: 40}

      - id: power_line
        name: "High tension power line"
        note: "765 / 400 / 220 / 132 kV — the wire may be crossed anywhere except next to an existing tower: 20 % of that span from the tower (80 m of a 400 m span; Vivek, 10 Oct 2026); angle 70–110° and span ≤ 350 m (Rule_Table 9-11 had 300; Vivek, 10 Oct 2026); D towers both sides of lines ≥ 400 kV, B/C/D for 132–220 kV (TSD B.1-2); our towers ≥ 80 m (our tower height, Vivek 11 Oct 2026; was 92.5 / 101.5) from their towers and conductors at 765 kV — a falling tower must not reach another line; our conductor keeps CHW from theirs"
        layer: power
        classes: [power_line, power_tower]
        mechanism: crossing
        params:
          # Vivek, 11 Oct 2026: both distances = our tower height, upper limit of the standard body by line
          # voltage (765: 80, 400: 55, 220: 40, 132: 32, 66: 22 m), no extension and no extra buffer; the
          # falling-tower premise is one-sided — our conductor keeps only CHW from their towers and wires
          # Vivek, 13 Oct 2026: the standard body without extension is 72.5 m at 765 kV; a normal tower keeps that from
          # existing towers and conductors when not crossing. (55 / 40 / 32 m for the other line voltages as supplied.)
          - {key: tower_setback_m, label: "Tower to existing tower (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          # Vivek, 14 Oct 2026: 80 m between our towers and existing conductors (was the tower height, 72.5 m)
          - {key: conductor_setback_m, label: "Our tower to existing conductor", type: num, unit: m, value: {765: 80, 400: 80, 220: 80, 132: 80}}
          # Vivek, 14 Oct 2026: our conductor as far from their towers as our towers are from their conductors
          - {key: conductor_tower_setback_m, label: "Our conductor to existing tower", type: num, unit: m, value: {765: 80, 400: 80, 220: 80, 132: 80}}   # Vivek, 14 Oct 2026: 80 m
          # Crossing preferences (Vivek, 13 Oct 2026): preferred = at the null point and at 90°; allowed = within
          # crossing_point_allowed_pct of their span from the null point and within angle_deg. A crossing outside the
          # preference costs the search relax_penalty_pct of the crossing tower's price, so it is used only where the
          # preferred crossing would cost more (a detour, extra towers, or no route).
          - {key: crossing_point_pref_pct, label: "Preferred: at the null point, ± share of their span", type: num, unit: "%", value: 5}
          - {key: crossing_point_allowed_pct, label: "Allowed: from the null point, ± share of their span", type: num, unit: "%", value: 20}
          - {key: crossing_tower_clear_m, label: "… fallback clear of a tower where its span is not mapped", type: num, unit: m, value: 80}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [70, 110]}
          # restored 19 Oct 2026 (Vivek): the crossing span cap of 10 Oct, dropped on 13 Oct when the crossing-tower window
          # came in on the belief that the window bounds the span — it does not (the window is relaxable at a search cost;
          # 376-434 m crossings came through). Both apply: the window places the towers, this caps the span.
          # Vivek, 19 Oct 2026: 250 m (was 350 m restored the same day)
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 250}
          - {key: angle_min_kv, label: "Crossing angle applies from", type: num, unit: kV, value: 66}
          # the two crossing towers stand 1.2-1.7 × our tower height from the crossed conductor, no more (72.5 m → 87-123 m)
          - {key: crossing_side_m, label: "Crossing tower to the crossed conductor, each side (min-max)", type: rng, unit: m, value: {765: [87, 123], 400: [66, 94], 220: [48, 68], 132: [38, 54]}}
          # Vivek, 14 Oct 2026: where the window cannot be kept (another line, buildings next to the crossing), the
          # crossing towers may stand further out — the span relaxed only as far as needed: every metre beyond the
          # maximum costs the search this share of the crossing tower's price per 25 m; the minimum stays hard
          - {key: side_relax_pct_per_25m, label: "Beyond the maximum: search cost per 25 m, % of the crossing tower's price", type: num, unit: "%", value: 100}
          # Vivek, 13 Oct 2026: the position penalty is graded — 0 at the null point, rising linearly with the distance from
          # it to the full allowance at the edge of the allowed band, so the crossing stays as close to the null point as it can
          - {key: relax_penalty_pct, label: "Search allowance for a non-preferred crossing, % of the crossing tower's price (position: graded from the null point)", type: num, unit: "%", value: 20}
          - {key: tower_type, label: "Tower type", type: sel, value: "B/C/D", options: ["A/B/C/D", "B", "C", "D", "B/C/D"]}
          # Vivek, 16 Oct 2026: D towers both sides of a crossed line strictly above 66 kV (exactly 66 kV is not); was ≥ 400 kV
          - {key: hv_tower_type, label: "Tower type, crossed lines above the next value", type: sel, value: "D", options: ["B/C/D", "D"]}
          - {key: hv_above_kv, label: "… applies to lines strictly above", type: num, unit: kV, value: 66}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

      # Added 6 Oct 2026 with the HT / LT split (Vivek): same values as the high tension rule for
      # now, set independently. Same shutdown crossing cost.
      - id: power_line_lt
        name: "Low tension power line"
        note: "66 / 33 kV — crossed anywhere except next to a pole: 20 % of that span from the pole (20 m of a 100 m pole span; Vivek, 10 Oct 2026); suspension or tension towers either side (TSD B.3); angle 70–110° from 66 kV (Rule_Table 9); our towers ≥ 80 m (our tower height, Vivek 11 Oct 2026; was 92.5 / 101.5) from their poles and conductors at 765 kV"
        layer: power_lt
        classes: [power_line, power_tower]
        mechanism: crossing
        params:
          # Vivek, 11 Oct 2026: both distances = our tower height, upper limit of the standard body by line
          # voltage (765: 80, 400: 55, 220: 40, 132: 32, 66: 22 m), no extension and no extra buffer; the
          # falling-tower premise is one-sided — our conductor keeps only CHW from their towers and wires
          # Vivek, 13 Oct 2026: the standard body without extension is 72.5 m at 765 kV; a normal tower keeps that from
          # existing towers and conductors when not crossing. (55 / 40 / 32 m for the other line voltages as supplied.)
          - {key: tower_setback_m, label: "Tower to existing tower (our tower height)", type: num, unit: m, value: {765: 72.5, 400: 55, 220: 40, 132: 32}}
          # Vivek, 14 Oct 2026: 80 m between our towers and existing conductors (was the tower height, 72.5 m)
          - {key: conductor_setback_m, label: "Our tower to existing conductor", type: num, unit: m, value: {765: 80, 400: 80, 220: 80, 132: 80}}
          # 66 / 33 kV poles stand 60–100 m apart, so a line crossing one cannot keep a tower height from every pole:
          # here the conductor keeps the corridor half-width from the poles (Vivek, 14 Oct 2026 — HT lines: tower height)
          - {key: conductor_tower_setback_m, label: "Our conductor to existing pole (corridor half-width)", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          # Crossing preferences (Vivek, 13 Oct 2026): preferred = at the null point and at 90°; allowed = within
          # crossing_point_allowed_pct of their span from the null point and within angle_deg. A crossing outside the
          # preference costs the search relax_penalty_pct of the crossing tower's price, so it is used only where the
          # preferred crossing would cost more (a detour, extra towers, or no route).
          - {key: crossing_point_pref_pct, label: "Preferred: at the null point, ± share of their span", type: num, unit: "%", value: 5}
          - {key: crossing_point_allowed_pct, label: "Allowed: from the null point, ± share of their span", type: num, unit: "%", value: 20}
          - {key: crossing_tower_clear_m, label: "… fallback clear of a tower where its span is not mapped", type: num, unit: m, value: 80}
          - {key: preferred_angle_deg, label: "Preferred crossing angle", type: num, unit: "°", value: 90}
          - {key: preferred_angle_tol_deg, label: "… tolerance", type: num, unit: "°", value: 5}
          - {key: angle_deg, label: "Allowed crossing angle", type: rng, unit: "°", value: [70, 110]}
          # restored 19 Oct 2026 (Vivek): the crossing span cap of 10 Oct, dropped on 13 Oct when the crossing-tower window
          # came in on the belief that the window bounds the span — it does not (the window is relaxable at a search cost;
          # 376-434 m crossings came through). Both apply: the window places the towers, this caps the span.
          # Vivek, 19 Oct 2026: 250 m (was 350 m restored the same day)
          # Vivek, 20 Oct 2026: LT crossing span 260 ± 10 m — 250-270 m normally; shorter needs an approval record (the search
          # keeps to the band at a penalty, as the state-highway band); never over 270 m
          - {key: max_span_m, label: "Max crossing span", type: num, unit: m, value: 270}
          - {key: span_band_m, label: "Crossing span without approval (min-max)", type: rng, unit: m, value: [250, 270]}
          - {key: span_band_penalty_pct, label: "Outside the band: search cost, % of the crossing tower's price (approval record)", type: num, unit: "%", value: 20}
          - {key: angle_min_kv, label: "Crossing angle applies from", type: num, unit: kV, value: 66}
          # the two crossing towers stand 1.2-1.7 × our tower height from the crossed conductor, no more (72.5 m → 87-123 m)
          # Vivek, 20 Oct 2026 (with the 250-270 m band): at 765 kV up to 135 m each side — a 250-270 m span square to the wire puts
          # each crossing tower 125-135 m from it, beyond the 123 m of the HT window (which would price every band crossing)
          - {key: crossing_side_m, label: "Crossing tower to the crossed conductor, each side (min-max)", type: rng, unit: m, value: {765: [87, 135], 400: [66, 94], 220: [48, 68], 132: [38, 54]}}
          # Vivek, 14 Oct 2026: where the window cannot be kept (another line, buildings next to the crossing), the
          # crossing towers may stand further out — the span relaxed only as far as needed: every metre beyond the
          # maximum costs the search this share of the crossing tower's price per 25 m; the minimum stays hard
          - {key: side_relax_pct_per_25m, label: "Beyond the maximum: search cost per 25 m, % of the crossing tower's price", type: num, unit: "%", value: 100}
          # Vivek, 13 Oct 2026: the position penalty is graded — 0 at the null point, rising linearly with the distance from
          # it to the full allowance at the edge of the allowed band, so the crossing stays as close to the null point as it can
          - {key: relax_penalty_pct, label: "Search allowance for a non-preferred crossing, % of the crossing tower's price (position: graded from the null point)", type: num, unit: "%", value: 20}
          - {key: tower_type, label: "Tower type", type: sel, value: "A/B/C/D", options: ["A/B/C/D", "B", "C", "D", "B/C/D"]}
          # Vivek, 16 Oct 2026: D towers both sides of a crossed line strictly above 66 kV (exactly 66 kV is not); was ≥ 400 kV
          - {key: hv_tower_type, label: "Tower type, crossed lines above the next value", type: sel, value: "D", options: ["B/C/D", "D"]}
          - {key: hv_above_kv, label: "… applies to lines strictly above", type: num, unit: kV, value: 66}
          - {key: parallel_setback_m, label: "Conductor buffer, parallel run", type: num, unit: m, value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5}}
          - {key: max_dev_adjacent_deg, label: "Max deviation at the two crossing towers", type: num, unit: "°", value: 45}

  - key: gng
    title: "Land classes — go or no-go"
    desc: "Each class is either routable or not. No weights: how strongly the engine prefers one class is internal, not a business input."
    rules:
      - id: forest
        name: "Reserve and protected forest"
        note: "Routable by default — diversion approval is required in every case. Set to No-Go to keep the route out entirely; or cap the hectares a strict route may take (Vivek, 10 Oct 2026: 5 ha), which the search meets by pricing forest up until the route stays under it."
        layer: reserve_forest
        also_layers: [forest_in_pa]
        mechanism: landclass
        cost_class: forest
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}
          - {key: ro_threshold_ha, label: "Regional Office threshold", type: num, unit: ha, value: 5}
          - {key: conservator_threshold_ha, label: "Conservator inspection threshold", type: num, unit: ha, value: 40}
          # Vivek, 10 Oct 2026: cap on the reserve forest a strict route (1, 2, 4) may take. The search prices
          # forest ×3 / ×10 / ×30 until the route is under the cap; the reported cost uses the true prices.
          # 0 = no cap. The relaxed route is exempt.
          - {key: max_area_ha, label: "Max reserve forest per route (strict routes; 0 = no cap)", type: num, unit: ha, value: 0}   # final rules 19 Oct 2026 (run BHU-LAK-0250): no numeric cap, forest priced and approval-reported
          # Vivek, 14 Oct 2026: one search with forest made dearer instead of the ×3/×10/×30/×100 re-runs; the
          # loop only runs if the route is still over the cap. ₹1 Cr/ha ≈ what the ×30 pass used to add.
          # Vivek, 14 Oct 2026: cap only — no search surcharge; the multiplier loop keeps a route over the cap under it
          - {key: search_surcharge_cr_ha, label: "Search surcharge on reserve forest (not in the reported cost)", type: num, unit: "₹ Cr/ha", value: 0.0}

      - id: agriculture
        name: "Agricultural land"
        note: "Compensation cost applies across the corridor and is set on the Costs screen"
        layer: lulc
        classes: [agriculture, agriculture_fallow]
        mechanism: landclass
        cost_class: agriculture
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}

      - id: orchard
        name: "Orchard and plantation"
        note: "Rule_Table 85-86: corridor half-width buffer; crossing as last resort, with the orchard cost"
        layer: lulc
        classes: [orchard]
        mechanism: landclass
        cost_class: orchard
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Corridor half-width", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Fixed buffer", type: num, unit: m, value: 0}

      - id: marsh
        name: "Marshy land"
        note: "Rule_Table 77-78 had 50 m / last resort. Vivek, 10 Oct 2026: towers allowed on marshy land, on pile foundations (soil multiplier 1.85 through the layer's foundation class) — existing lines run through the soil-map marsh. 16 Oct 2026: the 50 m buffer field removed (it was never applied while marsh is allowed); the 1.85 is a price assumption, not a pile design"
        layer: lulc
        classes: [marsh]
        also_layers: [marshy_land]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}

      - id: salt_pans
        name: "Salt pans"
        note: "Rule_Table 59-60: 200 m buffer; crossing as last resort on pile foundations (12 months)"
        layer: lulc
        classes: [salt_pan]
        also_layers: [salt_pans]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 200}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      - id: salt_pan_water
        name: "Salt pans (water bodies)"
        note: "Salt pans mapped in the water layers: Rule_Table 59-60, 200 m buffer, crossing as last resort on piles (12 months)"
        layer: other_water
        classes: [salt_pan]
        mechanism: nogo
        params:
          - {key: tower_setback_m, label: "Tower buffer", type: num, unit: m, value: 200}
          - {key: conductor_buffer_m, label: "Conductor buffer", type: num, unit: m, value: 200}
          - {key: treatment, label: "Treatment", type: sel, value: "Last resort", options: ["No-Go", "Last resort", "Allowed"]}
          - {key: last_resort_towers_inside, label: "Last resort: towers inside (piles)", type: sel, value: "Yes", options: ["Yes", "No"]}
          - {key: approval_months, label: "Approval time if crossed", type: num, unit: months, value: 12}

      - id: wetland
        name: "Wetland"
        note: "Rule_Table 75-76: routable; towers on pile foundations (no foundation within 50 m of the 10-year mean high-flood level — no HFL data yet)"
        layer: wet_land
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "Last resort", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "None", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}

      - id: social_forest
        name: "Social forest"
        note: "Planted strip alongside road, canal or railway"
        layer: social_forest
        mechanism: landclass
        cost_class: social_forest
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}
          - {key: strip_width_m, label: "Strip width from infrastructure", type: num, unit: m, value: 30}

      - id: barren
        name: "Shrubs, barren and hard rock"
        note: "Cheapest ground on any corridor; hard rock is dearer to excavate, which the foundation rate handles"
        layer: lulc
        classes: [shrub, barren, hard_rock, sand_dunes, unclassified]
        also_layers: [hard_rock, sand_dunes]
        mechanism: landclass
        cost_class: barren
        params:
          - {key: treatment, label: "Treatment", type: sel, value: "Allowed", options: ["Allowed", "No-Go"]}
          - {key: buffer, label: "Buffer", type: sel, value: "Fixed", options: ["Corridor half-width", "Fixed", "None"]}
          - {key: buffer_m, label: "Buffer", type: num, unit: m, value: 0}

  - key: geo
    title: "Geometry and towers"
    desc: "Span, deviation and tower selection. No layer needed."
    rules:
      - id: max_deviation
        name: "Maximum angular deviation"
        note: "Top of the largest tower class available"
        mechanism: geometry
        params:
          - {key: limit_deg, label: "Limit", type: num, unit: "°", value: 60}

      - id: design_span
        name: "Design span"
        note: "Design span per voltage. 765 kV: 400 m (Vivek, 9 Oct 2026 — the TSD wind span of the base towers; the TSD normal span of 370 m stays the sag reference). Vivek, 18 Oct 2026: an ordinary span may be up to the longest span allowed (765 kV: 450 m); every span longer than the plain design span costs the search ₹0.05 Cr per 10 m over it, pro rata (search only, never in the reported cost); hilly spans take the same maximum and the same charge; the TSD wind span of the base towers is 450 m. Crossing span limits (SH 400 m, NH 250 m, railway, river 720 m), the approach-section span and the TSD adjacent-span tables are unchanged. Hilly = the ground rises more than 10 m between adjacent towers (Route_Rules 3); towers on a hilly span are tension towers (B1 at least). The TSD span tables (sum of adjacent spans by deviation, wind span ≤ 450 m) apply on top. River crossings excepted."
        mechanism: geometry
        params:
          - {key: plain_m, label: "Plain terrain", type: num, unit: m, value: {765: 400, 400: 400, 220: 350, 132: 320}}
          - {key: hilly_m, label: "Hilly terrain", type: num, unit: m, value: {765: 400, 400: 400, 220: 350, 132: 320}}
          # Vivek, 18 Oct 2026: spans up to max_span_m; over the plain design span each one pays a search-only charge,
          # pro rata per metre (a 430 m span ₹0.15 Cr); 220 / 132 kV keep their plain value, so nothing changes there
          - {key: max_span_m, label: "Longest span allowed (spans over the plain design span pay the search charge below)", type: num, unit: m, value: {765: 450, 400: 450, 220: 350, 132: 320}}
          - {key: excess_cost_cr_per_10m, label: "Search cost per 10 m over the design span", type: num, unit: "₹ Cr", value: 0.05}
          - {key: hilly_rise_m, label: "Hilly: ground rise between towers over", type: num, unit: m, value: 10}
          # Vivek, 14 Oct 2026: avoid hills — towers there are hard to build. Hill ground from the DEM: relief
          # (highest minus lowest ground within the radius) AND mean slope over the window; small patches dropped.
          # Search-only surcharges (not in the reported cost): the route goes round a hill wherever the detour costs less
          - {key: hill_relief_m, label: "Hill: local relief at least", type: num, unit: m, value: 25}
          - {key: hill_relief_radius_m, label: "Hill: relief measured within", type: num, unit: m, value: 250}
          - {key: hill_mean_slope_deg, label: "Hill: mean slope at least", type: num, unit: "°", value: 3}
          - {key: hill_slope_window_m, label: "Hill: slope averaged over", type: num, unit: m, value: 270}
          - {key: hill_min_area_ha, label: "Hill: smallest patch kept", type: num, unit: ha, value: 5}
          - {key: hill_surcharge_cr_km, label: "Search surcharge per km of line over hill ground", type: num, unit: "₹ Cr/km", value: 2.0}
          - {key: hill_tower_surcharge_cr, label: "Search surcharge per tower on hill ground", type: num, unit: "₹ Cr", value: 1.0}
          # what-if switch (15 Oct 2026): an angle point priced as a decision, not just steel — search-only, on every
          # tower that is not a suspension tower; 0 = off
          - {key: angle_point_surcharge_cr, label: "Search surcharge per angle point (not in the reported cost)", type: num, unit: "₹ Cr", value: 0}
          - {key: urban_m, label: "Urban / populated", type: num, unit: m, value: {765: 250, 400: 250, 220: 225, 132: 200}, best_guess: true}

      - id: section_interval
        name: "Section point interval"
        note: "Tension point using a B/DB, C/DC or D/DD tower"
        mechanism: geometry
        params:
          - {key: plain_km, label: "Plain terrain", type: num, unit: km, value: 5}
          - {key: hilly_km, label: "Hilly terrain", type: num, unit: km, value: 3}
          - {key: plain_spans, label: "Plain terrain, spans", type: num, unit: spans, value: 15}
          - {key: hilly_spans, label: "Hilly terrain, spans", type: num, unit: spans, value: 10}

      - id: corridor_half_width
        name: "Corridor half-width"
        note: "Half the notified right of way for the line voltage (MoP RoW guidelines 2015)"
        mechanism: geometry
        params:
          - {key: half_width_m, label: "Half-width for this line", type: num, unit: m,
             value: {765: 33.5, 400: 23, 220: 17.5, 132: 13.5},
             best_guess: true}
          - {key: urban_half_width_m, label: "Urban half-width", type: num, unit: m, value: {765: 27, 400: 20, 220: 15, 132: 12}, best_guess: true}

      - id: approach_section
        name: "Approach section near substation"
        note: "CEA Technical Standards (1st Amendment) 2025, Schedule VII: near the substation the RoW narrows (765 kV D/C 54 m) and the span is at most 250 m. Applied within the set distance of each gantry, start and end (Vivek, 8 Oct 2026: 2 km); buffers tied to the corridor half-width shrink with it. Go zone (Vivek, 9 Oct 2026: 500 m round each gantry): no setback, crossing or water rule applies — a tower may stand in a pond or wetland — only a tower base may not overlap a substation or an existing tower (power, telecom, wind turbine). Crossings of lines from 220 kV up keep only their angle window there (Vivek, 14 Oct 2026: no crossing-tower window, null-point band or 45° cap in the go zone). Base = the largest tower type's base square; an existing tower is taken as the same size."
        mechanism: geometry
        params:
          - {key: length_m, label: "Distance from the gantry", type: num, unit: m, value: 2000}
          - {key: half_width_m, label: "Approach half-width (RoW / 2)", type: num, unit: m, value: {765: 27, 400: 19, 220: 12, 132: 9.5}}
          # Vivek, 13 Oct 2026: no separate approach span limit — the normal design span applies (empty = design span)
          - {key: span_m, label: "Approach maximum span (empty = design span)", type: num, unit: m, value: null}
          - {key: go_zone_m, label: "Go zone round each gantry", type: num, unit: m, value: 500}

      # Soft rules (Vivek, 9 Oct 2026): they steer the search, never the reported cost.
      - id: existing_line_proximity
        name: "Stay close to existing lines (search only)"
        note: "Spans within the set distance of an existing line or tower of at least the set voltage get a discount on their line and RoW cost, and towers standing there a discount on their price, in the search and the tower spotting — the route is pulled towards existing corridors, which are ground-surveyed and built to the real rules (Vivek, 13 Oct 2026). The reported cost of every route is the true cost, without the discount. Parallel-spacing and crossing rules still apply."
        layer: power
        mechanism: soft
        params:
          - {key: distance_m, label: "Within", type: num, unit: m, value: 1000}
          - {key: discount_pct, label: "Search discount on spans (line + RoW)", type: num, unit: "%", value: 20}
          # Vivek, 13 Oct 2026: existing lines are ground-surveyed and built to the real rules, so staying near them
          # also corrects LULC errors — the towers standing within the distance get the same search discount
          - {key: tower_discount_pct, label: "Search discount on towers", type: num, unit: "%", value: 20}
          - {key: min_kv, label: "Existing lines from", type: num, unit: kV, value: 220}

      - id: precedent_easing
        name: "Learn from existing lines"
        note: "Used only when a route finds no feasible path under its rules: a restricted polygon that existing power towers already stand in (a wetland, pond, lake, reservoir, coastal water, CRZ zone, salt pan, forest, wildlife sanctuary or national park) is opened for that route, that polygon only. Crossing rules (rivers, roads, lines) and built-up, substation, airport, defence, monument and dam rules are never eased. Each eased polygon is listed with the route; a sanctuary, park or forest needs forest diversion approval by area."
        layer: power
        mechanism: soft
        params:
          - {key: treatment, label: "When no route is found", type: sel, value: "Ease", options: ["Ease", "Off"]}

      - id: tower_type_bands
        name: "Tower type by deviation"
        note: "Band boundaries in degrees — the band a deviation falls in picks the tower"
        mechanism: geometry
        params:
          # five types of Route Cost Parameters 3 (B2, C2 dropped — Vivek, 7 Oct 2026)
          - {key: A, label: "A up to", type: num, unit: "°", value: 2}
          - {key: B1, label: "B1 up to", type: num, unit: "°", value: 15}
          - {key: C1, label: "C1 up to", type: num, unit: "°", value: 30}
          - {key: D45, label: "D45 up to", type: num, unit: "°", value: 45}
          - {key: D60, label: "D60 up to", type: num, unit: "°", value: 60}

      - id: crossing_span_limits
        name: "Span limits at a crossing"
        note: "Minimum stands in for the falling-tower distance"
        mechanism: geometry
        params:
          - {key: min_span_m, label: "Minimum span", type: num, unit: m, value: 100}
          - {key: angle_point_shift_m, label: "Angle point shift allowance", type: num, unit: m, value: 100}
