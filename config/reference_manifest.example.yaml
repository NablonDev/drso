# Which statewide file feeds which reference layer. Copy to reference_manifest.yaml, check every
# entry against the delivered files, then run:  python scripts/ingest_all.py config/reference_manifest.yaml
#
# Paths are relative to `root`. Entries below follow the file names seen in "LULC output" on
# 5 Oct 2026 (the upload was incomplete at the time) — VERIFY layer names, class fields and the
# class map before ingesting. Unmapped source classes fall back to the layer's first class and
# are listed by the script.
root: "/srv/beeline/incoming/LULC output"
version: "2026-10-gujarat-v1"

layers:
  forest:
    path: "Forest Areas/gj_forest_delivery.gpkg"
    const_class: reserve_forest
    name_field: null
    source: "Forest boundaries delivery"
    source_date: null
  # roads: now sourced from the OSM highway store (beeline_api/osm_highways), not the reference
  # store. The GatiShakti NH file can still be attached to a run with "Add more" on Data sources.
  # roads:
  #   - path: "Highways/India_National_Highways_GatiShakti.gpkg"
  #     const_class: nh
  #     source: "PM GatiShakti national highways"
  #   - path: "Highways/India_State_Highways_OSM.gpkg"
  #     const_class: sh
  #     source: "OSM state highways"
  rail:
    path: "Railway Stations and Lines/gujarat_railway_stations.gpkg"
    layer: null            # pick the lines layer, not the stations layer
    const_class: railway
    source: "Railway lines"
  # Existing network only (Vivek, 5 Oct 2026): VEDAS/PPAC survey-grade alignments (1:50,000 @2020)
  # + 56 OSM infills. Not ingested: the schematic GEM routes (10-24 km vertex spacing), the 2026
  # PARIVESH / forest-clearance proposal routes, facility points, CGD areas and QA layers.
  pipelines:
    - path: "transfers/pipelines/India_Oil_Gas_Pipelines_v3.gpkg"
      layer: Pipelines_Gas
      const_class: gas_pipeline
      name_field: name
      id_field: uid
      keep_fields: [owner, fuel_class, status_raw, source, source_vintage, positional_class]
      source: "Oil & gas pipelines v3 — gas (VEDAS/PPAC 2020 + OSM)"
    - path: "transfers/pipelines/India_Oil_Gas_Pipelines_v3.gpkg"
      layer: Pipelines_Oil_and_Products
      const_class: oil_pipeline
      name_field: name
      id_field: uid
      keep_fields: [owner, fuel_class, status_raw, source, source_vintage, positional_class]
      source: "oil and products (VEDAS/PPAC 2020 + OSM)"
    - path: "transfers/pipelines/India_Oil_Gas_Pipelines_v3.gpkg"
      layer: Pipelines_Unclassified       # 1 ONGC line in Assam, fuel unknown — kept as gas
      const_class: gas_pipeline
      name_field: name
      id_field: uid
      keep_fields: [owner, fuel_class, status_raw, source, source_vintage, positional_class]
      source: "unclassified (OSM)"
  # Soil types: one gpkg (no file extension), five layers that never overlap. NGLM 1:50k
  # geomorphology, Resourcesat-1 LISS-III 2005-06, cross-checked per feature (confidence field).
  hard_rock:
    path: "transfers/soil types/gujarat_soil_types_5_layers"
    layer: "Soil Type - Hard Rock (top strata)"
    const_class: hard_rock
    name_field: landform
    conf_field: confidence
    id_field: feature_id
    keep_fields: [landform, substrate_class, eng_material, dune_state, symcode, surface_water_class, currency_check, sources_agreeing, sources_dissenting, base_epoch]
    source: "Soil types — hard rock (NGLM 2005-06, cross-checked)"
    source_date: "2005-06"
  sand_dunes:
    path: "transfers/soil types/gujarat_soil_types_5_layers"
    layer: "Soil Type - Sand Dunes (top strata)"
    const_class: sand_dunes
    name_field: landform
    conf_field: confidence
    id_field: feature_id
    keep_fields: [landform, substrate_class, eng_material, dune_state, symcode, surface_water_class, currency_check, sources_agreeing, sources_dissenting, base_epoch]
    source: "Soil types — active sand dunes (NGLM 2005-06, cross-checked)"
    source_date: "2005-06"
  sandy_plain:
    path: "transfers/soil types/gujarat_soil_types_5_layers"
    layer: "Soil Type - Sandy Plain (top strata)"
    const_class: sandy_plain
    name_field: landform
    conf_field: confidence
    id_field: feature_id
    keep_fields: [landform, substrate_class, eng_material, dune_state, symcode, surface_water_class, currency_check, sources_agreeing, sources_dissenting, base_epoch]
    source: "Soil types — stabilised sandy plain (NGLM 2005-06, cross-checked)"
    source_date: "2005-06"
  salt_pans:
    path: "transfers/soil types/gujarat_soil_types_5_layers"
    layer: "Soil Type - Salt Panes"
    const_class: salt_pan
    name_field: landform
    conf_field: confidence
    id_field: feature_id
    keep_fields: [landform, substrate_class, eng_material, dune_state, symcode, surface_water_class, currency_check, sources_agreeing, sources_dissenting, base_epoch]
    source: "Soil types — salt pans (NGLM 2005-06, cross-checked)"
    source_date: "2005-06"
  marshy_land:
    path: "transfers/soil types/gujarat_soil_types_5_layers"
    layer: "Soil Type - Marshy Land"
    const_class: marsh
    name_field: landform
    conf_field: confidence
    id_field: feature_id
    keep_fields: [landform, substrate_class, eng_material, dune_state, symcode, surface_water_class, currency_check, sources_agreeing, sources_dissenting, base_epoch]
    source: "Soil types — marsh / mangrove swamp (NGLM 2005-06, cross-checked)"
    source_date: "2005-06"
  # CRZ: the sea / Gulf water polygon only for now (one MultiPolygon, 107,762 km2, reaching
  # ~130 km offshore and south to Maharashtra). HTL and CRZ I-IV zones to be added as classes.
  crz:
    path: "transfers/CRZ/crz_water_gujarat.geojson"
    const_class: crz_water
    source: "CRZ — sea / Gulf water polygon (Gujarat delivery)"
  # Bridges. `structures` is the consolidated open layer (OSM + NHAI + SOI). The HERE, Mappls and
  # Google-derived flyover layers are included for the DEMO ONLY (Vivek, 6 Oct 2026: client informed
  # of the restrictions). Every feature from them carries provider + licence so it can be stripped
  # before any real delivery: drop the three `licence_restricted: true` entries and re-ingest.
  # Raw tile pieces (here_road_pieces_bridge_tunnel, mappls_raw_pieces) duplicate the dissolved
  # layers and are not used. Centreline widths below are class defaults (assumption).
  bridges:
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "gujarat_structures_all_sources_1 — structures"
      class_field: struct_type
      class_map: {bridge: road_bridge, bridge_or_flyover: road_bridge, flyover: flyover, elevated: flyover,
                  rail_bridge: rail_bridge, underpass_embankment: underpass}
      name_field: name
      id_field: uid
      keep_fields: [struct_type, status, road_class, ref_route, deck_width_m, length_m, "confidence:confidence_grade", sources, nhai_fow]
      const_fields: {provider: "OSM + NHAI + SOI", licence: "ODbL (OSM) / GoI sources"}
      source: "Bridges — OSM (Overture 2026-08, Geofabrik 2026-09) + Bhuvan NHAI + SOI corroboration"
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "here_gujarat_bridges_INTERNAL_1 — here_bridges"
      licence_restricted: true
      class_field: kind
      class_map: {rail: rail_bridge, highway: road_bridge, major_road: road_bridge, minor_road: road_bridge, path: road_bridge}
      name_field: name
      line_width_m: {field: kind_detail, default: 7, map: {motorway: 25, trunk: 15, primary: 12, secondary: 9, tertiary: 7,
                     residential: 6, service: 5, rail: 6, footway: 3}}
      keep_fields: [kind_detail, ref, z_level, under_construction, length_m]
      const_fields: {provider: HERE, licence: "HERE base tiles — internal analysis only; DEMO, not licensed for delivery"}
      source: "HERE Vector Tile API v2 bridges (pulled 2026-09-29) — DEMO ONLY, licence-restricted"
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "here_gujarat_bridges_INTERNAL_1 — here_tunnels"
      licence_restricted: true
      const_class: underpass
      name_field: name
      line_width_m: {field: kind_detail, default: 7, map: {trunk: 15, primary: 12, secondary: 9, tertiary: 7, residential: 6, service: 5}}
      keep_fields: [kind_detail, ref, z_level, length_m]
      const_fields: {provider: HERE, licence: "HERE base tiles — internal analysis only; DEMO, not licensed for delivery"}
      source: "HERE tunnels / underpasses — DEMO ONLY, licence-restricted"
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "mappls_gujarat_structures_INTERNAL — mappls_elevated"
      licence_restricted: true
      const_class: flyover
      line_width_m: {field: cls, default: 10, map: {motorway: 20, highway: 15, arterial: 12, primary: 10, limited: 10}}
      keep_fields: [cls, length_m]
      const_fields: {provider: Mappls, licence: "Mappls rendered map content — internal analysis only; DEMO, not licensed for delivery"}
      source: "Mappls elevated roads (tiles v=092026) — DEMO ONLY, licence-restricted"
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "mappls_gujarat_structures_INTERNAL — mappls_underground"
      licence_restricted: true
      const_class: underpass
      line_width_m: {field: cls, default: 10, map: {motorway: 20, arterial: 12, primary: 10, limited: 10}}
      keep_fields: [cls, length_m]
      const_fields: {provider: Mappls, licence: "Mappls rendered map content — internal analysis only; DEMO, not licensed for delivery"}
      source: "Mappls underground roads — DEMO ONLY, licence-restricted"
    - path: "transfers/bridges/OUTPUT.gpkg"
      layer: "gujarat_flyovers — flyovers"
      licence_restricted: true
      const_class: flyover
      name_field: road_name
      keep_fields: [class, ref, length_m, area_m2]
      const_fields: {provider: Google Routes, licence: "Google Maps Platform ToS — derivative datasets not permitted; DEMO only"}
      source: "Flyovers from Google Routes flyoverInfo (Sep 2026) — DEMO ONLY, licence-restricted"
  # aviation / approach: now sourced from the aviation store (beeline_api/aviation; README step 8).
  # airport_boundary_merged.gpkg stacks Esri and OSM without de-duplication — do not ingest it.
  substations:
    path: "substation/AESL_SUBSTATIONS_FINAL.gpkg"
    const_class: substation
    source: "AESL substations"
  solar:
    path: "Solar Park/Bhuj_Lakadia_Solar_Parks_v2.gpkg"
    const_class: solar_park
    source: "Solar parks v2"
  water:
    - path: "waterbodies/gujarat_rivers_canals_final.gpkg"
      class_field: null    # map river / canal / nalla
      source: "Rivers and canals"
    - path: "waterbodies/gujarat_water_bodies_by_type.gpkg"
      class_field: null    # map pond / dam / creek
      source: "Water bodies by type"
  power:
    - path: "transmission_towers/high_voltage/lines_high_voltage.gpkg"
      const_class: power_line
      source: "HV lines"
    - path: "transmission_towers/high_voltage/towers_high_voltage.gpkg"
      const_class: power_tower
      source: "HV towers"
    - path: "transmission_towers/low_voltage/lines_low_voltage.gpkg"
      const_class: power_line
      source: "LV lines"
    - path: "transmission_towers/low_voltage/towers_low_voltage.gpkg"
      const_class: power_tower
      source: "LV towers"
  buildings:
    path: "Buildup area/corridor_footprints_finetuned.gpkg"
    const_class: building
    source: "Building footprints (fine-tuned model)"
    model: "footprints-finetuned"
  plotted:
    path: "plotted_land/Bhuj_Lakadia_Plotted_Land_FINAL.gpkg"
    const_class: plotted_land
    source: "Plotted land FINAL"
