# Layer registry. One entry per layer the drafter sees on the Data sources screen.
#
# key            stable id used by rules, the DB and the API
# kind           polygon | line | point (geometry the engine expects after normalisation)
# producer       reference  -> clipped from a statewide gpkg in the bucket (cached layer)
#                model      -> produced by a LULC model over imagery (stub in v1: reads the
#                              reference gpkg and stamps model + imagery provenance)
#                derived    -> computed from another layer (clusters from buildings)
#                osm        -> PostGIS store of OSM power lines/towers (beeline_api/osm_power)
#                osm_highways -> PostGIS store of OSM national / state highways (beeline_api/osm_highways)
#                tarangsanchar -> PostGIS store of DoT mobile tower sites (beeline_api/cell_towers)
# refreshable    the layer has an online source the review screen can re-pull for the run's
#                area ("Refresh from <refresh_label>")
# model          plugin name in beeline_api/models (model producers only)
# imagery        which imagery product the model reads (provenance only in v1)
# classes        Beeline class vocabulary for this layer; the attribute-mapping screen maps
#                a file's values onto these. First entry is the fallback class.
# minutes_per_km2  model time estimate used for the extraction ETA on the setup screens
# default_confidence  used when a source carries no per-feature confidence

version: "2026.10-v1"

layers:
  - key: lulc
    name: "Land use / land cover"
    kind: polygon
    producer: model
    model: lulc_stub
    imagery: sentinel2
    desc: "LULC segmentation model · Sentinel-2 10 m"
    minutes_per_km2: 0.174
    default_confidence: 0.89
    classes: [unclassified, agriculture, agriculture_fallow, orchard, shrub, barren, hard_rock,
              marsh, salt_pan, sand_dunes, social_forest, reserve_forest, water_body, built_up]

  - key: buildings
    name: "Buildings"
    kind: polygon
    producer: model
    model: buildings_stub
    imagery: esri
    desc: "Footprint model · 50 cm imagery"
    minutes_per_km2: 0.214
    default_confidence: 0.94
    classes: [building]

  - key: clusters
    name: "Built-up clusters"
    kind: polygon
    producer: derived
    derived_from: buildings
    desc: "Grouped from the buildings layer at 50 m / 9,000 m²"
    minutes_per_km2: 0.009
    default_confidence: 0.91
    classes: [builtup_cluster]

  # Water: eight layers from the Gujarat water-bodies package (NWIA 2019 + OSM + GatiShakti,
  # 31 Aug 2026), replacing the single "water" layer (Vivek, 6 Oct 2026). Inventory, not
  # notification: each feature keeps its legal_status and positional precision.
  - key: pond
    name: "Pond"
    kind: polygon
    producer: reference
    desc: "Tanks, ponds and aquaculture ponds — NWIA 2019 + GatiShakti + OSM"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    classes: [pond, aquaculture_pond]

  - key: river
    name: "River"
    kind: polygon
    producer: reference
    desc: "River and stream areas — NWIA 2019 + GatiShakti + OSM"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    classes: [river]

  - key: lake
    name: "Lake"
    kind: polygon
    producer: reference
    desc: "Natural lakes and ponds, ox-bows — OSM + NWIA 2019"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    classes: [lake]

  - key: canal
    name: "Canal"
    kind: any
    producer: reference
    desc: "Canal water areas (OSM) + canal centrelines (GatiShakti, ~110 m precision)"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    classes: [canal]

  - key: reservoir
    name: "Reservoir"
    kind: polygon
    producer: reference
    desc: "Reservoirs and barrages (water extent) — OSM + NWIA 2019"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    classes: [reservoir]

  - key: nalla
    name: "Nalla"
    kind: any
    producer: reference
    desc: "Nallas and small drains — no source yet"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    classes: [nalla]

  - key: wet_land
    name: "Wet Land"
    kind: polygon
    producer: reference
    desc: "Unclassified wetland and waterlogged land — NWIA 2019 + OSM (not notified)"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    classes: [wetland, waterlogged]

  - key: other_water
    name: "Other water"
    kind: polygon
    producer: reference
    desc: "Creeks, beach, coral reef, lagoons, mud flats, salt marsh, salt pans, mangroves, recent detected water, 25 km marine buffer"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    classes: [creek, beach, coral_reef, lagoon, mud_flat, salt_marsh, salt_pan, mangrove, detected_water, marine_buffer]

  - key: soil
    name: "Soil — marsh, salt pan, dunes, rock"
    kind: polygon
    producer: model
    model: soil_stub
    imagery: sentinel2
    desc: "Spectral classifier + BHUKOSH lithology"
    minutes_per_km2: 0.085
    default_confidence: 0.74
    classes: [normal_dry, wet_submerged, black_cotton, hard_rock, sandy_fissured]

  # Soil types (transfers/soil types/gujarat_soil_types_5_layers, Gujarat statewide). NGLM 1:50k
  # geomorphology (Resourcesat-1 LISS-III, 2005-06) cross-checked per feature against LD50K, JRC
  # water, DEM slope, Sentinel-2 dry NDVI and SoilGrids clay. The five layers never overlap.
  # foundation_class: the costs.yaml foundation multiplier a tower inside the layer pays.
  - key: hard_rock
    name: "Soil — hard rock (top strata)"
    kind: polygon
    producer: reference
    minutes_per_km2: 0.002
    desc: "Cached — NGLM 2005-06 geomorphology, cross-checked"
    default_confidence: 0.95
    foundation_class: hard_rock
    classes: [hard_rock]

  - key: sand_dunes
    name: "Soil — sand dunes (top strata)"
    kind: polygon
    producer: reference
    minutes_per_km2: 0.002
    desc: "Cached — NGLM 2005-06 active dunes, cross-checked"
    default_confidence: 0.85
    foundation_class: sandy_fissured
    classes: [sand_dunes]

  - key: sandy_plain
    name: "Soil — sandy plain (top strata)"
    kind: polygon
    producer: reference
    minutes_per_km2: 0.002
    desc: "Cached — NGLM 2005-06 stabilised sand, cross-checked"
    default_confidence: 0.95
    foundation_class: sandy_fissured
    classes: [sandy_plain]

  - key: salt_pans
    name: "Soil — salt pans"
    kind: polygon
    producer: reference
    minutes_per_km2: 0.002
    desc: "Cached — NGLM 2005-06 salt pans, cross-checked"
    default_confidence: 0.9
    foundation_class: wet_submerged
    classes: [salt_pan]

  - key: marshy_land
    name: "Soil — marshy land"
    kind: polygon
    producer: reference
    minutes_per_km2: 0.002
    desc: "Cached — NGLM 2005-06 marsh / mangrove swamp, cross-checked"
    default_confidence: 0.6
    foundation_class: wet_submerged
    classes: [marsh]

  - key: power
    name: "Power lines and towers"
    kind: any
    producer: osm
    desc: "OpenStreetMap power=line / power=tower · 765, 400, 220, 132 kV only"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    voltages: [765, 400, 220, 132]
    refreshable: true
    refresh_label: OSM
    classes: [power_line, power_tower]

  - key: telecom
    name: "Cell towers"
    kind: point
    producer: tarangsanchar
    desc: "Tarang Sanchar (DoT) mobile tower sites · ground, roof and wall"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    refreshable: true
    refresh_label: Tarang Sanchar
    classes: [cell_tower]

  - key: village_roads
    name: "Village roads"
    kind: line
    producer: lulc_model
    pipeline: village_roads
    imagery: esri
    desc: "Road model (Microsoft RoadDetections res-unet-6) · Esri Wayback z18"
    minutes_per_km2: 0.03
    default_confidence: 0.80
    classes: [village_road]

  - key: plotted
    name: "Plotted land"
    kind: polygon
    producer: lulc_model
    pipeline: plotted_land
    imagery: esri
    desc: "Plot-layout geometry over village roads + buildings · WorldCover salt filter"
    minutes_per_km2: 0.01
    default_confidence: 0.61
    classes: [plotted_land]

  # Key stays "roads" so the national-highway rule and saved runs keep working.
  - key: roads
    name: "Highways — NH, SH"
    kind: line
    producer: osm_highways
    desc: "OpenStreetMap national and state highways · ref + IN:NH / IN:SH relations"
    minutes_per_km2: 0.002
    default_confidence: 0.90
    refreshable: true
    refresh_label: OSM
    classes: [nh, sh]

  - key: rail
    name: "Railway and metro"
    kind: line
    producer: reference
    desc: "Cached — OSM, manually checked"
    minutes_per_km2: 0.002
    default_confidence: 0.96
    classes: [railway, metro]

  - key: forest
    name: "Forest boundaries"
    kind: polygon
    producer: reference
    desc: "Cached — SOI toposheet"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    classes: [reserve_forest, protected_forest]

  - key: protected
    name: "Protected areas and ESZ"
    kind: polygon
    producer: reference
    desc: "Cached — SOI legal boundaries"
    minutes_per_km2: 0.002
    default_confidence: 0.99
    classes: [sanctuary, national_park, esz]

  - key: wetlands
    name: "Notified wetlands"
    kind: polygon
    producer: reference
    desc: "Cached — State Wetland Authority notification"
    minutes_per_km2: 0.002
    default_confidence: 0.99
    classes: [notified_wetland]

  # Coastal Regulation Zone. Delivered so far: the sea / Gulf water polygon only
  # (transfers/CRZ/crz_water_gujarat.geojson). HTL and CRZ I-IV zones will follow (Vivek, 6 Oct
  # 2026) as further classes of this layer; the "Coastal regulation zone" rule reads crz_water.
  - key: crz
    name: "Coastal regulation zone"
    kind: polygon
    producer: reference
    desc: "Cached — sea / Gulf water side (HTL and CRZ I-IV zones to follow)"
    minutes_per_km2: 0.002
    default_confidence: 0.90
    classes: [crz_water]

  # Airports and their runways (beeline_api/aviation). Both are read beyond the band by reach_m
  # (or the rule distance, whichever is larger) and not clipped: the NOC radius and the
  # prohibition distance reach airports that sit outside the corridor.
  - key: aviation
    name: "Airports"
    kind: polygon
    producer: esri_airports
    desc: "Esri India Living Atlas airport boundaries (AAI) + OSM airports not in it"
    minutes_per_km2: 0.002
    default_confidence: 0.95
    refreshable: true
    refresh_label: Living Atlas + OSM
    reach_m: 25000
    classes: [airport]

  - key: approach
    name: "Airport approach path"
    kind: polygon
    producer: osm_runways
    desc: "OSM runways as polygons · width tag, else 45 m"
    minutes_per_km2: 0.002
    default_confidence: 0.90
    refreshable: true
    refresh_label: OSM
    reach_m: 3000
    classes: [runway]

  - key: monuments
    hidden: true          # hidden 6 Oct 2026 (Vivek): only OSM test data so far; un-hide with ASI / notified defence data
    name: "Monuments"
    kind: any
    producer: reference
    desc: "Cached — ASI protected list"
    minutes_per_km2: 0.002
    default_confidence: 1.0
    classes: [monument]

  - key: pipelines
    name: "Pipelines"
    kind: line
    producer: reference
    desc: "Cached — VEDAS/PPAC survey-grade alignments (2020) + OSM infill · existing network only"
    minutes_per_km2: 0.004
    default_confidence: 0.90
    classes: [gas_pipeline, oil_pipeline]

  - key: defence
    hidden: true          # hidden 6 Oct 2026 (Vivek): only OSM test data so far; un-hide with ASI / notified defence data
    name: "Defence land"
    kind: polygon
    producer: reference
    desc: "Cached — notified defence boundary records"
    minutes_per_km2: 0.002
    default_confidence: 0.97
    classes: [defence_land]

  # Layers that rules need but that the prototype folds into other rows. They are shown on
  # the sources screen under "More layers" so the drafter can still replace them.
  - key: substations
    name: "Sub-stations"
    kind: polygon
    producer: lulc_model
    pipeline: substations
    desc: "Substation model (DINOv3 LoRA, stage B) · Esri Wayback z18 + Sentinel-1 gate"
    minutes_per_km2: 0.006
    default_confidence: 0.85
    classes: [substation]

  - key: solar
    name: "Solar parks"
    kind: polygon
    producer: lulc_model
    pipeline: solar
    desc: "Solar model (DINOv3 LoRA) · Esri Wayback z18 + Sentinel-2 NIR filter"
    minutes_per_km2: 0.012
    default_confidence: 0.85
    classes: [solar_park]

  - key: wind_turbines
    name: "Wind turbines"
    kind: point
    producer: lulc_model
    pipeline: wind_turbines
    desc: "Turbine model (DINOv3 LoRA round 4 + Exp-G) · Cartosat-3 PAN 0.45 m"
    minutes_per_km2: 0.05
    default_confidence: 0.90
    classes: [wind_turbine]
