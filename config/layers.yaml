# Layer registry. One entry per layer the drafter sees on the Data sources screen.
#
# key            stable id used by rules, the DB and the API
# kind           polygon | line | point (geometry the engine expects after normalisation)
# producer       reference  -> clipped from a statewide gpkg in the bucket (cached layer)
#                model      -> produced by a LULC model over imagery (stub in v1: reads the
#                              reference gpkg and stamps model + imagery provenance)
#                derived    -> computed from another layer (clusters from buildings)
#                osm        -> PostGIS store of OSM power lines/towers (beeline_api/osm_power)
#                osm_highways -> PostGIS store of OSM national / state highways (beeline_api/osm_highways)
#                tarangsanchar -> PostGIS store of DoT mobile tower sites (beeline_api/cell_towers)
# refreshable    the layer has an online source the review screen can re-pull for the run's
#                area ("Refresh from <refresh_label>")
# model          plugin name in beeline_api/models (model producers only)
# imagery        which imagery product the model reads (provenance only in v1)
# classes        Beeline class vocabulary for this layer; the attribute-mapping screen maps
#                a file's values onto these. First entry is the fallback class.
# minutes_per_km2  model time estimate used for the extraction ETA on the setup screens
# default_confidence  used when a source carries no per-feature confidence

version: "2026.10-v1"

layers:
  - key: lulc
    name: "Land use / land cover"
    kind: polygon
    producer: model
    model: lulc_stub
    imagery: sentinel2
    desc: "LULC segmentation model · Sentinel-2 10 m"
    minutes_per_km2: 0.174
    default_confidence: 0.89
    classes: [unclassified, agriculture, agriculture_fallow, orchard, shrub, barren, hard_rock,
              marsh, salt_pan, sand_dunes, social_forest, reserve_forest, water_body, built_up]

  - key: buildings
    name: "Buildings"
    kind: polygon
    producer: model
    model: buildings_stub
    imagery: esri
    desc: "Footprint model · 50 cm imagery"
    minutes_per_km2: 0.214
    default_confidence: 0.94
    classes: [building]

  - key: clusters
    name: "Built-up clusters"
    kind: polygon
    producer: derived
    derived_from: buildings
    desc: "Grouped from the buildings layer at 50 m / 9,000 m²"
    minutes_per_km2: 0.009
    default_confidence: 0.91
    classes: [builtup_cluster]

  - key: water
    name: "Water — river, canal, nalla, pond"
    kind: any
    producer: model
    model: water_stub
    imagery: sentinel2
    desc: "Water index model + India-WRIS"
    minutes_per_km2: 0.058
    default_confidence: 0.93
    classes: [pond, river, canal, nalla, dam, creek]

  - key: soil
    name: "Soil — marsh, salt pan, dunes, rock"
    kind: polygon
    producer: model
    model: soil_stub
    imagery: sentinel2
    desc: "Spectral classifier + BHUKOSH lithology"
    minutes_per_km2: 0.085
    default_confidence: 0.74
    classes: [normal_dry, wet_submerged, black_cotton, hard_rock, sandy_fissured]

  - key: power
    name: "Power lines and towers"
    kind: any
    producer: osm
    desc: "OpenStreetMap power=line / power=tower · 765, 400, 220, 132 kV only"
    minutes_per_km2: 0.002
    default_confidence: 0.85
    voltages: [765, 400, 220, 132]
    refreshable: true
    refresh_label: OSM
    classes: [power_line, power_tower]

  - key: telecom
    name: "Cell towers"
    kind: point
    producer: tarangsanchar
    desc: "Tarang Sanchar (DoT) mobile tower sites · ground, roof and wall"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    refreshable: true
    refresh_label: Tarang Sanchar
    classes: [cell_tower]

  - key: village_roads
    name: "Village roads"
    kind: line
    producer: lulc_model
    pipeline: village_roads
    imagery: esri
    desc: "Road model (Microsoft RoadDetections res-unet-6) · Esri Wayback z18"
    minutes_per_km2: 0.03
    default_confidence: 0.80
    classes: [village_road]

  - key: plotted
    name: "Plotted land"
    kind: polygon
    producer: lulc_model
    pipeline: plotted_land
    imagery: esri
    desc: "Plot-layout geometry over village roads + buildings · WorldCover salt filter"
    minutes_per_km2: 0.01
    default_confidence: 0.61
    classes: [plotted_land]

  # Key stays "roads" so the national-highway rule and saved runs keep working.
  - key: roads
    name: "Highways — NH, SH"
    kind: line
    producer: osm_highways
    desc: "OpenStreetMap national and state highways · ref + IN:NH / IN:SH relations"
    minutes_per_km2: 0.002
    default_confidence: 0.90
    refreshable: true
    refresh_label: OSM
    classes: [nh, sh]

  - key: rail
    name: "Railway and metro"
    kind: line
    producer: reference
    desc: "Cached — OSM, manually checked"
    minutes_per_km2: 0.002
    default_confidence: 0.96
    classes: [railway, metro]

  - key: forest
    name: "Forest boundaries"
    kind: polygon
    producer: reference
    desc: "Cached — SOI toposheet"
    minutes_per_km2: 0.002
    default_confidence: 0.80
    classes: [reserve_forest, protected_forest]

  - key: protected
    name: "Protected areas and ESZ"
    kind: polygon
    producer: reference
    desc: "Cached — SOI legal boundaries"
    minutes_per_km2: 0.002
    default_confidence: 0.99
    classes: [sanctuary, national_park, esz]

  - key: wetlands
    name: "Notified wetlands"
    kind: polygon
    producer: reference
    desc: "Cached — State Wetland Authority notification"
    minutes_per_km2: 0.002
    default_confidence: 0.99
    classes: [notified_wetland]

  # Airports and their runways (beeline_api/aviation). Both are read beyond the band by reach_m
  # (or the rule distance, whichever is larger) and not clipped: the NOC radius and the
  # prohibition distance reach airports that sit outside the corridor.
  - key: aviation
    name: "Airports"
    kind: polygon
    producer: esri_airports
    desc: "Esri India Living Atlas airport boundaries (AAI) + OSM aerodromes not in it"
    minutes_per_km2: 0.002
    default_confidence: 0.95
    refreshable: true
    refresh_label: Esri Living Atlas
    reach_m: 25000
    classes: [airport]

  - key: approach
    name: "Airport approach path"
    kind: polygon
    producer: osm_runways
    desc: "OSM runways as polygons · width tag, else 45 m"
    minutes_per_km2: 0.002
    default_confidence: 0.90
    reach_m: 3000
    classes: [runway]

  - key: monuments
    name: "Monuments"
    kind: any
    producer: reference
    desc: "Cached — ASI protected list"
    minutes_per_km2: 0.002
    default_confidence: 1.0
    classes: [monument]

  - key: pipelines
    name: "Pipelines"
    kind: line
    producer: reference
    desc: "Cached — published alignments + operator records"
    minutes_per_km2: 0.004
    default_confidence: 0.90
    classes: [gas_pipeline, oil_pipeline]

  - key: defence
    name: "Defence land"
    kind: polygon
    producer: reference
    desc: "Cached — notified defence boundary records"
    minutes_per_km2: 0.002
    default_confidence: 0.97
    classes: [defence_land]

  # Layers that rules need but that the prototype folds into other rows. They are shown on
  # the sources screen under "More layers" so the drafter can still replace them.
  - key: substations
    name: "Sub-stations"
    kind: polygon
    producer: lulc_model
    pipeline: substations
    desc: "Substation model (DINOv3 LoRA, stage B) · Esri Wayback z18 + Sentinel-1 gate"
    minutes_per_km2: 0.006
    default_confidence: 0.85
    classes: [substation]

  - key: solar
    name: "Solar parks"
    kind: polygon
    producer: lulc_model
    pipeline: solar
    desc: "Solar model (DINOv3 LoRA) · Esri Wayback z18 + Sentinel-2 NIR filter"
    minutes_per_km2: 0.012
    default_confidence: 0.85
    classes: [solar_park]

  - key: wind_turbines
    name: "Wind turbines"
    kind: point
    producer: lulc_model
    pipeline: wind_turbines
    desc: "Turbine model (DINOv3 LoRA round 4 + Exp-G) · Cartosat-3 PAN 0.45 m"
    minutes_per_km2: 0.05
    default_confidence: 0.90
    classes: [wind_turbine]
