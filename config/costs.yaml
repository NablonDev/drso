      - {key: earthwire_cr_km, label: "Earthwire", unit: "₹Cr/km", value: {765: 0.09, 400: 0.07, 220: 0.05, 132: 0.04}, best_guess: true}
      - {key: stringing_cr_km, label: "Stringing labour", unit: "₹Cr/km", value: {765: 0.14, 400: 0.09, 220: 0.06, 132: 0.04}, best_guess: true}
      - {key: spacer_cr_km, label: "Spacer and damper set", unit: "₹Cr/km", value: {765: 0.06, 400: 0.04, 220: 0.02, 132: 0.01}, best_guess: true}

  - key: foundation
    title: "Soil type & foundation"
    desc: "Foundation class drives the excavation and concrete quantity"
    status: tcc
    items:
      - {key: normal_dry, label: "Normal dry", unit: "× base", value: 1.0}
      - {key: wet_submerged, label: "Wet / submerged", unit: "× base", value: 1.34}
      - {key: black_cotton, label: "Black cotton", unit: "× base", value: 1.52}
      - {key: hard_rock, label: "Hard rock", unit: "× base", value: 1.68}
      - {key: sandy_fissured, label: "Sandy / fissured", unit: "× base", value: 1.41}
      - {key: base_cr_tower, label: "Base foundation", unit: "₹Cr/twr", value: {765: 0.18, 400: 0.09, 220: 0.045, 132: 0.025}, best_guess: true}

  - key: crossings
    title: "Crossings"
    desc: "Extra cost at each controlled crossing — permission, shutdown and heavier towers"
    status: tcc
    items:
      - {key: railway, label: "Railway crossing", unit: "₹L each", value: 34}
      - {key: national_highway, label: "National highway", unit: "₹L each", value: 18}
      - {key: power_line, label: "Power line, shutdown", unit: "₹L each", value: 26}
      - {key: major_river, label: "Major river", unit: "₹L each", value: 62}
      - {key: pipeline, label: "Pipeline", unit: "₹L each", value: 14}
