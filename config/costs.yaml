# Cost rates — AESL Route Cost Parameters 3 (Inputs + Towers sheets, non-hidden rows), applied 7 Oct 2026.
# "Card" = AESL Cost Raster Rate Card, Nablon AI, 21 Sep 2026 (765 kV D/C reference, Bhuj–Lakadiya).
# Double circuit only (S/C and Q/C out of scope, Vivek 7 Oct 2026).
# status: sourced | tcc  (tcc = awaiting AESL TCC sign-off; the report names every such category)
# Values may be scalars or per-voltage maps ("765", "400", "220", "132", "default").
# Removed 7 Oct 2026 (Vivek): diversion processing, crossing charges, earthing, crops & trees,
# environment / CRZ, stamp & legal, sandy / fissured foundation class. The +18 m extension is kept,
# priced at 9.4 % of the tower's own all-in price (Vivek, 7 Oct 2026).

version: "AESL-RCP3-2026.10"

categories:
  - key: land
    title: "Land & RoW"
    desc: "Settled land value (jantri notified 43 ₹/m² × settlement multiplier 15 = 645 ₹/m², rural), corridor and tower-base compensation"
    status: sourced
    items:
      - {key: land_cr_ha, label: "Land value, rural (settled)", unit: "₹Cr/ha", value: 0.645}
      - {key: row_corridor_pct, label: "Corridor compensation, rural", unit: "% land", value: 30}
      - {key: tower_base_pct, label: "Tower-base compensation", unit: "% land", value: 200}

  - key: forest
    title: "Forest diversion"
    desc: "NPV, compensatory afforestation and plans per hectare diverted; reserve-forest land in the corridor; NPV multiplier inside a protected area"
    status: sourced
    items:
      - {key: npv_l_ha, label: "Forest NPV, dense", unit: "₹L/ha", value: 8.61}
      - {key: ca_l_ha, label: "Compensatory afforestation", unit: "₹L/ha", value: 1.1}
      - {key: plans_l_ha, label: "Wildlife and soil-moisture plans", unit: "₹L/ha", value: 1.6}
      - {key: rf_land_cr_ha, label: "Reserve forest land", unit: "₹Cr/ha", value: 0.48}
      - {key: pa_wls_mult, label: "NPV multiplier, Wildlife Sanctuary", unit: "× NPV", value: 5}
      - {key: pa_np_mult, label: "NPV multiplier, National Park", unit: "× NPV", value: 10}

  - key: line
    title: "Line cost per km"
    desc: "Conductor, insulators, fittings and stringing per km of line (765 kV D/C card rates); lower voltages scale by the line cost factor. Towers and land excluded."
    status: tcc
    items:
      - {key: conductor_cr_km, label: "Conductor", unit: "₹Cr/km", value: 1.61}
      - {key: insulators_cr_km, label: "Insulators and hardware", unit: "₹Cr/km", value: 0.325}
      - {key: accessories_cr_km, label: "Accessories (spacers, dampers)", unit: "₹Cr/km", value: 0.09}
      - {key: erection_cr_km, label: "Erection and stringing", unit: "₹Cr/km", value: 0.324}
      - {key: earthwire_cr_km, label: "Earthwire and OPGW", unit: "₹Cr/km", value: 0, best_guess: true}
      - {key: line_factor, label: "Line cost factor (× 765 kV D/C)", unit: "×", value: {765: 1.0, 400: 0.4, 220: 0.17, 132: 0.10}}

  - key: foundation
    title: "Soil & foundation"
    desc: "Foundation multiplier by soil class; only the extra over a normal foundation is costed (the tower price includes a normal one)"
    status: tcc
    items:
      - {key: normal_dry, label: "Normal dry", unit: "× base", value: 1.0}
      - {key: black_cotton, label: "Black cotton", unit: "× base", value: 1.55}
      - {key: hard_rock, label: "Rock", unit: "× base", value: 1.2}
      - {key: wet_submerged, label: "Soft / creek / flooded (piles)", unit: "× base", value: 1.85}
      # vj copy (22 Oct 2026, Vivek): towers standing in rivers on piles — provisional, 5 × the normal foundation
      - {key: river_pile, label: "River bed (piles)", unit: "× base", value: 5.0}

  - key: buildings
    title: "Buildings"
    desc: "Demolition compensation per m² of plinth — relaxed route only (not used while buildings are No-Go)"
    status: tcc
    items:
      - {key: composite_rs_m2, label: "Composite / load-bearing", unit: "₹/m² plinth", value: 20750}
      - {key: rcc_rs_m2, label: "RCC framed", unit: "₹/m² plinth", value: 24410}

  - key: tower
    title: "Towers"
    desc: "All-in price per tower by type (normal foundation included), base foundation and base area — D/C; body extension"
    status: tcc
    items:
      - {key: extension_pct, label: "Body extension, +18 m", unit: "% tower price", value: 9.4}
    # price_cr: ₹ Cr per tower incl. normal foundation; fdn_l: base (normal) foundation ₹ lakh;
    # area_m2: base area for tower-base compensation. 765 kV = card; others indicative (sheet).
