        D45: {price_cr: 0.4389, fdn_l: 12.85, area_m2: 441}
        D60: {price_cr: 0.4988, fdn_l: 15.0, area_m2: 441}
      "220":
        A:   {price_cr: 0.0953, fdn_l: 1.3, area_m2: 60.84}
